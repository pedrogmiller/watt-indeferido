  <select id="fPo" data-act="filtro" data-k="po" aria-label="Onde"><option value="livre">Livres</option><option value="rival" ${fo === 'rival' ? 'selected' : ''}>Nos rivais</option><option value="todos" ${fo === 'todos' ? 'selected' : ''}>Todos</option></select></div>
  <div class="tw"><table><thead><tr>${th('pes', 'nome', 'Nome')}${th('pes', 'fN', 'Função')}${th('pes', 'pr', 'Função (1–20)', 1)}${ATR.map(([k, n]) => `<th class="n ns">${n.slice(0, 4)}.</th>`).join('')}${th('pes', 'idade', 'Idade', 1)}${th('pes', 'salario', 'Salário', 1)}${th('pes', 'ondeN', 'Onde')}</tr></thead><tbody>
  ${rows.map((p) => `<tr class="click" data-act="ficha" data-t="pessoa" data-id="${p.id}"><td>${esc(p.nome)}${p.rel ? ' <span class="tag g">relatório</span>' : ''}</td><td>${p.fN}</td><td class="n av ${attrCls(p, p.funcao)}">${attrTxt(p, p.funcao)}</td>${ATR.map(([k]) => `<td class="n av ${attrCls(p, k)}">${attrTxt(p, k)}</td>`).join('')}<td class="n">${p.idade}</td><td class="n">${p.salario} k€</td><td>${esc(p.ondeN)}</td></tr>`).join('') || '<tr><td colspan="12" class="dim">Ninguém com estes filtros.</td></tr>'}
  </tbody></table></div>`;
};

VIEWS.rede = () => {
  const rows = ordenar('sub', G.subs.map((s) => ({ ...s, nT: G.terrenos.filter((t) => t.se === s.id && t.estado === 'mercado').length, nR: G.rivais.reduce((a, r) => a + r.projetos.filter((p) => p.se === s.id).length, 0) })), { k: 'livre', dir: -1 });
  return `<div class="vh"><div><h2>Subestações</h2><p>Capacidade livre, fila de pedidos e calor (procura de terrenos). Os reforços planeados pela REN só se veem com um bom engenheiro de rede, ou quando a REN os anuncia.</p></div></div>
  <div class="tw"><table><thead><tr>${th('sub', 'nome', 'Subestação')}${th('sub', 'regiao', 'Região')}${th('sub', 'kv', 'kV', 1)}${th('sub', 'livre', 'MW livres', 1)}${th('sub', 'fila', 'Fila', 1)}${th('sub', 'calor', 'Calor', 1)}${th('sub', 'irr', 'kWh/kWp', 1)}${th('sub', 'camara', 'Câmara')}${th('sub', 'amb', 'Sens. ambiental', 1)}${th('sub', 'nT', 'Terrenos', 1)}${th('sub', 'nR', 'Projetos rivais', 1)}<th class="ns">Reforço</th></tr></thead><tbody>
  ${rows.map((s) => `<tr class="click" data-act="ficha" data-t="se" data-id="${s.id}"><td>${s.nome}</td><td>${s.regiao}</td><td class="n">${s.kv}</td><td class="n ${s.livre < 30 ? 'bad' : ''}">${s.livre}</td><td class="n">${s.fila}</td><td class="n">${Math.round(s.calor)}</td><td class="n">${s.irr}</td><td>${CAMARA[s.camara]}</td><td class="n">${s.amb >= 0.5 ? '<span class="bad">alta</span>' : s.amb >= 0.35 ? 'média' : 'baixa'}</td><td class="n">${s.nT}</td><td class="n">${s.nR}</td><td>${s.reforco && s.reforco.sabido && !s.reforco.feito ? `<span class="warn">+${s.reforco.mw} MW · ${mesLabel(s.reforco.mes)}</span>${s.reforco.publico ? '' : ' <span class="tag a">só nós sabemos</span>'}` : '<span class="dim">—</span>'}</td></tr>`).join('')}
  </tbody></table></div>`;
};

VIEWS.rivais = () => {
  const cl = classificacao();
  return `<div class="vh"><div><h2>Concorrência</h2><p>A tabela classificativa do setor: MW que cada empresa desenvolveu até RtB (projetos comprados não contam). Clique num rival para ver a carteira e a equipa.</p></div></div>
  <div class="tw"><table><thead><tr><th class="n ns">#</th><th class="ns">Empresa</th><th class="ns">Estilo</th><th class="n ns">MW levados a RtB</th><th class="n ns">Em operação</th><th class="n ns">Em desenvolvimento</th><th class="n ns">Projetos</th></tr></thead><tbody>
  ${cl.map((r, i) => `<tr class="${r.jog ? '' : 'click'}" ${r.jog ? '' : `data-act="ficha" data-t="rival" data-id="${r.id}"`}><td class="n dim">${i + 1}</td><td>${r.jog ? `<b class="warn">${esc(r.nome)}</b>` : esc(r.nome)}</td><td>${r.estilo}</td><td class="n">${r.mw}</td><td class="n">${r.op}</td><td class="n">${r.pipe}</td><td class="n">${r.jog ? projAtivos().length : rival(r.id).projetos.length}</td></tr>`).join('')}
  </tbody></table></div>`;
};

VIEWS.carreira = () => {
  let hof = []; try { hof = JSON.parse(localStorage.getItem(HOF_KEY) || '[]'); } catch (_) { /* nada */ }
  return `<div class="vh"><div><h2>Carreira</h2><p>Semente do mundo: <b class="num">${esc(G.seed)}</b>. Com a mesma semente e as mesmas decisões, o mundo repete-se. O jogo guarda sozinho neste navegador.</p></div></div>
  <div class="grid">
    <div class="box"><h3>Esta carreira</h3><dl class="kv"><dt>Manager</dt><dd>${esc(G.manager)}</dd><dt>Empresa</dt><dd>${esc(G.empresa)}</dd><dt>Mandato atual</dt><dd>${G.mandato.n}</dd><dt>MW levados a RtB (total)</dt><dd>${G.mwRtbTotal}</dd><dt>Valor criado</dt><dd>${M(valorCriado())}</dd></dl>
      ${G.carreira.length ? `<table style="margin-top:8px"><tbody>${G.carreira.map((c) => `<tr><td>Mandato ${c.n}</td><td class="num">${c.rtb}/${c.meta} MW</td><td class="num">${M(c.valor)}</td></tr>`).join('')}</tbody></table>` : ''}
      <div class="row" style="margin-top:12px">${UI.confirm === 'nova' ? `<span>Abandonar esta carreira?</span><button class="btn danger" data-act="abandonarCarreira">Sim, abandonar</button><button class="btn" data-act="cancelar">Não</button>` : '<button class="btn" data-act="confirmarNova">Começar nova carreira</button>'}</div></div>
    <div class="box"><h3>Galeria de managers</h3>${hof.length ? `<div class="tw"><table><thead><tr><th class="ns">Manager</th><th class="ns">Empresa</th><th class="n ns">MW</th><th class="n ns">Valor</th><th class="ns">Desfecho</th></tr></thead><tbody>${hof.map((h) => `<tr><td>${esc(h.manager)}</td><td>${esc(h.empresa)}<br><span class="note">${esc(h.tier)} · semente ${esc(h.seed)}</span></td><td class="n">${h.rtb}</td><td class="n">${M(h.valor)}</td><td>${esc(h.desfecho)}<br><span class="note">${esc(h.ate)}</span></td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Ainda nenhuma carreira terminada neste navegador.</p>'}</div>
  </div>`;
};

/* ---------- fichas ---------- */
FICHAS.terreno = (id) => {
  const t = terreno(id); if (!t) return '<p>Terreno não encontrado.</p>';
  const s = sub(t.se);
  const ddEmCurso = G.tarefas.some((x) => x.tipo === 'dd' && x.alvo === t.id);
  const abordEmCurso = G.tarefas.some((x) => x.tipo === 'abordar' && x.alvo === t.id);
  const c = precoNeg(t.opcao);
  let acoes = '';
  if (t.estado === 'mercado') {
    if (t.origem === 'cadastro' && !t.aceita) acoes += abordEmCurso ? '<span class="dim">O landman está a falar com o proprietário.</span>' : `<button class="btn pri" data-act="abordar" data-id="${t.id}" ${temFuncao('ter', 9) ? '' : 'disabled'}>Abordar proprietário</button>${temFuncao('ter', 9) ? '' : ' <span class="note">Precisa de um landman.</span>'}`;
    else acoes += `<button class="btn pri" data-act="optar" data-id="${t.id}" ${G.caixa < c ? 'disabled' : ''}>Optar por ${K(c)}</button>`;
    acoes += t.dd ? '' : ddEmCurso ? ' <span class="dim">Due diligence em curso.</span>' : ` <button class="btn" data-act="dd" data-id="${t.id}">Due diligence (30 k€)</button>`;
  } else if (t.estado === 'jogador') {
    acoes += t.uso ? `Em uso no ${lnk('projeto', t.uso, projeto(t.uso).nome)}` : `<button class="btn danger" data-act="libertar" data-id="${t.id}">Libertar opção</button>`;
    if (!t.dd && !ddEmCurso) acoes += ` <button class="btn" data-act="dd" data-id="${t.id}">Due diligence (30 k€)</button>`;
  } else if (t.estado.startsWith('rival:')) acoes = `<span class="dim">Optado pela ${esc(rival(t.estado.slice(6)).nome)}.</span>`;
  else acoes = `<span class="dim">Indisponível (${t.estado}).</span>`;
  const esc_ = (k) => (t.dd ? (t.dd.achados.includes(k) ? '<span class="bad">Sim</span>' : '<span class="good">Não encontrado</span>') : '<span class="dim">?</span>');
  return `<div class="vh"><div><h2>${esc(t.nome)}</h2><p>${t.origem === 'cadastro' ? 'Parcela de cadastro' : t.origem === 'projeto' ? 'Terreno de projeto comprado' : 'Anúncio'} · ${lnk('se', s.id, 'SE ' + s.nome)} · ${s.regiao}</p></div></div>
  <div class="grid"><div class="box"><h3>Visível</h3><dl class="kv"><dt>Área</dt><dd>${t.ha} ha</dd><dt>Potência possível</dt><dd>${t.mwp} MWp</dd><dt>Irradiância</dt><dd>${t.irr} kWh/kWp</dd><dt>Distância à SE</dt><dd>${nf(t.dist, 1)} km</dd><dt>Renda</dt><dd>${nf(t.renda, 0)} €/ha/ano</dd><dt>Custo da opção</dt><dd>${K(t.opcao)}</dd><dt>Condicionantes</dt><dd>${tagsTerreno(t)}</dd></dl></div>
  <div class="box"><h3>Escondido</h3><dl class="kv"><dt>${PROB_ESC.titulos}</dt><dd>${esc_('titulos')}</dd><dt>${PROB_ESC.arqueo}</dt><dd>${esc_('arqueo')}</dd><dt>${PROB_ESC.montado}</dt><dd>${esc_('montado')}</dd><dt>Disposição do proprietário</dt><dd>${t.dd ? (t.dd.dono > 0.6 ? 'Boa' : t.dd.dono > 0.35 ? 'Neutra' : 'Difícil') : '<span class="dim">?</span>'}</dd></dl><p class="note">A due diligence revela o que está escondido (com um landman forte, com mais certeza). Problemas conhecidos pesam metade no licenciamento.</p></div></div>
  <div class="row" style="margin-top:14px">${acoes}</div>`;
};
FICHAS.pessoa = (id) => {
  const p = pessoa(id); if (!p) return '';
  const minha = p.onde === 'jogador';
  const relEmCurso = G.tarefas.some((x) => x.tipo === 'relatorio' && x.alvo === p.id);
  const deRival = p.onde.startsWith('rival:');
  return `<div class="vh"><div><h2>${esc(p.nome)}</h2><p>${FUNCOES[p.funcao]} · ${p.idade} anos · ${esc(ondeTxt(p))} · ${p.salario} k€/ano</p></div></div>
  <div class="grid"><div class="box"><h3>Atributos</h3><div class="attr">${ATR.map(([k, n]) => `<span>${n}</span><span class="av ${attrCls(p, k)}">${attrTxt(p, k)}</span>`).join('')}</div></div>
  <div class="box"><h3>Personalidade</h3><div class="attr"><span>Ambição</span><span class="av">${p.rel ? p.ambicao : '?'}</span><span>Lealdade</span><span class="av">${p.rel ? p.lealdade : '?'}</span><span>Potencial</span><span class="av">${p.rel ? p.potencial : '?'}</span></div><p class="note">Ambição alta: aceita sair de um rival, mas também aceita sair de si. Lealdade alta: o contrário.</p></div>
  <div class="box"><h3>Efeito no jogo</h3><p class="note">${{ ter: 'Abre terrenos de cadastro, convence proprietários e torna a due diligence mais fiável.', lic: 'Encurta e aprova estudos, PIP e licenças. Ajuda nas prorrogações.', rede: 'Descobre reforços da REN antes de serem públicos e melhora pedidos e acordos.', amb: 'Aumenta a probabilidade e reduz a duração da avaliação ambiental.', fin: 'Reservado para a próxima versão (financiamento de projeto).', neg: 'Desconto em terrenos e capacidade comprada; melhores ofertas pelos seus projetos.' }[p.funcao]}</p></div></div>
  <div class="row" style="margin-top:14px">${minha ? `<button class="btn danger" data-act="despedir" data-id="${p.id}">Despedir (indemnização ${K(p.salario * 0.25 / 1000)})</button>` : `${p.rel ? '' : relEmCurso ? '<span class="dim">Relatório em curso.</span>' : `<button class="btn" data-act="relatorio" data-id="${p.id}">Pedir relatório</button>`} <button class="btn pri" data-act="contratar" data-id="${p.id}">${deRival ? `Contratar à ${esc(rival(p.onde.slice(6)).nome)} (compensação ${K(p.salario * 0.5 / 1000)}, salário ${Math.round(p.salario * 1.2)} k€)` : `Contratar (${p.salario} k€/ano)`}</button>`}</div>`;
};
FICHAS.projeto = (id) => {
  const p = projeto(id); if (!p) return '';
  const s = sub(p.se); const t = trc(p.trc);
  const linhas = FASES.map((F, i) => {
    let st = '', pr = '';
    if (p.estado !== 'ativo') st = i < p.fi ? '✔' : '';
    else if (i < p.fi) st = '<span class="good">✔ feito</span>';
    else if (i === p.fi) st = i <= 2 ? (p.bloqueado ? '<span class="bad">recusada · decisão na caixa de entrada</span>' : p.pago ? `<span class="warn">em curso · faltam ${p.rest} meses</span>` : p.pausado ? 'pausado' : p.semCaixa ? '<span class="bad">à espera de caixa</span>' : 'arranca no próximo mês') : i === 4 ? `<span class="warn">faltam ${p.rest} meses</span>` : '<span class="good">●</span>';
    if (i <= 2 && p.estado === 'ativo' && i >= p.fi) pr = `<span class="${probCls(probVista(p, i))}">${pct(probVista(p, i))}</span> · ${duracao(i)} m · ${M(custoFase(p, i))}`;
    return `<tr><td>${F.nome}</td><td>${st}</td><td class="num">${pr}</td></tr>`;
  }).join('');
  let acoes = '';
  if (p.estado === 'ativo') {
    if (p.fi <= 2 && !p.bloqueado) acoes += `<button class="btn" data-act="pausar" data-id="${p.id}">${p.pausado ? 'Retomar' : 'Pausar'} (antes da próxima fase)</button>`;
    if (p.fi <= 3) acoes += p.aVenda && G.tarefas.some((x) => x.tipo === 'venda' && x.alvo === p.id) ? ' <span class="dim">À venda: ofertas no próximo mês.</span>' : ` <button class="btn" data-act="porVenda" data-id="${p.id}">Pôr à venda</button>`;
    if (p.fi === 3) acoes += ` <button class="btn pri" data-act="construir" data-id="${p.id}">Construir (capex ${M(p.mwp * CAPEX_MWP)}; ${G.tipo === 'operar' && G.confianca >= 50 ? 'capital da casa-mãe' : '25 % da caixa: ' + M(p.mwp * CAPEX_MWP * 0.25)})</button>`;
    if (t && !t.cumprido && !t.prorrogado && t.prazo - G.mes <= 12) acoes += ` <button class="btn" data-act="prorrogar" data-id="${t.id}">Pedir prorrogação do TRC</button>`;
    if (p.fi <= 3 && !p.bloqueado) acoes += ` <button class="btn danger" data-act="abandonarProj" data-id="${p.id}">Abandonar</button>`;
  }
  return `<div class="vh"><div><h2>${esc(p.nome)}</h2><p>${lnk('se', s.id, 'SE ' + s.nome)} · ${p.mwac} MWac / ${p.mwp} MWp · ${p.estado === 'ativo' ? FASES[p.fi].nome : p.estado}</p></div></div>
  <div class="grid"><div class="box"><h3>Fases</h3><table><thead><tr><th class="ns">Fase</th><th class="ns">Estado</th><th class="n ns">Prob. · duração · custo</th></tr></thead><tbody>${linhas}</tbody></table><p class="note">Probabilidades como a equipa as vê hoje. Problemas escondidos nos terrenos não entram até fazer due diligence.</p></div>
  <div class="box"><h3>Ficha</h3><dl class="kv"><dt>TRC</dt><dd>${t ? `${t.mw} MW · ${t.cumprido ? 'cumprido' : 'prazo ' + mesLabel(t.prazo)}` : '—'}</dd><dt>Terrenos</dt><dd>${p.terrenos.map((x) => lnk('terreno', x, terreno(x).nome)).join('<br>')}</dd><dt>Irradiância média</dt><dd>${irrProj(p)} kWh/kWp</dd><dt>Linha</dt><dd>${nf(p.linha || 0, 1)} km</dd><dt>Gasto até agora</dt><dd>${M(p.custo)}</dd><dt>Valor estimado</dt><dd>${M(valorProjeto(p))}</dd>${p.fi === 5 ? `<dt>Receita líquida/mês</dt><dd>${K(p.mwp * irrProj(p) * G.mercado.preco * 0.3 / 12 / 1e6)}</dd>` : ''}</dl></div>
  <div class="box"><h3>Histórico</h3>${p.log.slice().reverse().map((l) => `<p style="margin:0 0 4px">${esc(l)}</p>`).join('')}</div></div>
  <div class="row" style="margin-top:14px">${acoes}</div>`;
};
FICHAS.trc = (id) => {
  const t = trc(id); if (!t) return ''; const s = sub(t.se);
  return `<div class="vh"><div><h2>TRC ${s.nome} · ${t.mw} MW</h2><p>${esc(t.origem)} · obtido em ${mesLabel(t.obtido)}</p></div></div>
  <div class="box"><dl class="kv"><dt>Prazo para RtB</dt><dd>${t.cumprido ? 'cumprido' : mesLabel(t.prazo) + ` (${t.prazo - G.mes} meses)`}</dd><dt>Caução</dt><dd>${t.devolvida ? 'devolvida / sem caução' : K(t.caucao)}</dd><dt>Projeto</dt><dd>${t.projeto ? lnk('projeto', t.projeto, projeto(t.projeto).nome) : 'livre: use a mesa de montagem'}</dd></dl>
  <div class="row" style="margin-top:10px">${!t.cumprido && !t.prorrogado && t.estado === 'ativo' ? `<button class="btn" data-act="prorrogar" data-id="${t.id}">Pedir prorrogação (+12 meses, uma vez)</button>` : ''} ${!t.projeto ? `<button class="btn" data-act="nav" data-v="carteira">Ir à mesa de montagem</button>` : ''}</div></div>`;
};
FICHAS.se = (id) => {
  const s = sub(id);
  const proj = G.rivais.flatMap((r) => r.projetos.filter((p) => p.se === id).map((p) => ({ ...p, r })));
  const meus = G.projetos.filter((p) => p.se === id && p.estado === 'ativo');
  return `<div class="vh"><div><h2>SE ${s.nome}</h2><p>${s.regiao} · ${s.kv} kV · Câmara ${CAMARA[s.camara].toLowerCase()}</p></div></div>
  <div class="grid"><div class="box"><h3>Rede</h3><dl class="kv"><dt>MW livres</dt><dd>${s.livre}</dd><dt>Fila de pedidos</dt><dd>${s.fila} MW</dd><dt>Calor da zona</dt><dd>${Math.round(s.calor)}/100</dd><dt>Irradiância de referência</dt><dd>${s.irr} kWh/kWp</dd><dt>Sensibilidade ambiental</dt><dd>${s.amb >= 0.5 ? 'alta' : s.amb >= 0.35 ? 'média' : 'baixa'}</dd><dt>Reforço</dt><dd>${s.reforco && s.reforco.sabido && !s.reforco.feito ? `+${s.reforco.mw} MW em ${mesLabel(s.reforco.mes)}` : 'nenhum conhecido'}</dd></dl>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="nav" data-v="ligacoes">Pedir capacidade</button><button class="btn" data-act="verTerrenos" data-se="${s.id}">Ver terrenos</button></div></div>
  <div class="box"><h3>Projetos nesta SE</h3><table><tbody>${meus.map((p) => `<tr><td>${lnk('projeto', p.id, p.nome)}</td><td class="warn">${esc(G.empresa)}</td><td class="num">${p.mwac} MW</td><td>${FASES[p.fi].curto}</td></tr>`).join('')}${proj.map((p) => `<tr><td>${esc(p.nome)}</td><td>${lnk('rival', p.r.id, p.r.nome)}</td><td class="num">${p.mw} MW</td><td>${FASES[p.fi].curto}</td></tr>`).join('') || (meus.length ? '' : '<tr><td class="dim">Nenhum.</td></tr>')}</tbody></table></div></div>`;
};
ACT.verTerrenos = (d) => { UI.view = 'terrenos'; UI.f.tse = d.se; UI.f.test = 'mercado'; UI.ficha = null; render(); };
FICHAS.rival = (id) => {
  const r = rival(id); const eq = G.pessoas.filter((p) => p.onde === 'rival:' + id);
  const nots = G.noticias.filter((n) => n.r === id).slice(0, 10);
  return `<div class="vh"><div><h2>${esc(r.nome)}</h2><p>${ESTILO[r.estilo].nome} · ${esc(r.desc)}</p></div></div>
  <div class="grid"><div class="box"><h3>Números</h3><dl class="kv"><dt>MW em RtB</dt><dd>${r.mwRtb}</dd><dt>MW em operação</dt><dd>${r.mwOp}</dd><dt>MW vendidos</dt><dd>${r.mwVend}</dd><dt>Tesouraria</dt><dd>${r.caixa < 0.5 ? '<span class="bad">apertada</span>' : r.caixa < 3 ? 'normal' : '<span class="good">folgada</span>'}</dd><dt>Qualidade da equipa</dt><dd>${r.q >= 13 ? 'alta' : r.q >= 10 ? 'média' : 'baixa'}</dd></dl></div>
  <div class="box"><h3>Carteira</h3><table><tbody>${r.projetos.map((p) => `<tr><td>${esc(p.nome)}</td><td>${lnk('se', p.se, sub(p.se).nome)}</td><td class="num">${p.mw} MW</td><td>${FASES[p.fi].curto}</td></tr>`).join('') || '<tr><td class="dim">Vazia.</td></tr>'}</tbody></table></div>
  <div class="box"><h3>Quadros conhecidos</h3><table><tbody>${eq.map((p) => `<tr><td>${lnk('pessoa', p.id, p.nome)}</td><td>${FUNCOES[p.funcao]}</td><td class="num">${attrTxt(p, p.funcao)}</td></tr>`).join('') || '<tr><td class="dim">Nenhum.</td></tr>'}</tbody></table></div>
  <div class="box"><h3>Últimos movimentos</h3>${nots.map((n) => `<p style="margin:0 0 4px"><span class="dim num">${mesLabel(n.mes)}</span> ${esc(n.txt)}</p>`).join('') || '<p class="note">Nada recente.</p>'}</div></div>`;
};

function viewFim() {
  const f = G.fim; const r = f.resumo;
  if (f.tipo === 'mandato') {
    const tit = { cumprido: 'Mandato cumprido', reservas: 'Renovado com reservas', falhado: 'Mandato falhado' }[f.veredito];
    const txt = { cumprido: `O Comité está satisfeito: ${r.rtb} MW em RtB para uma meta de ${r.meta}. Oferece-lhe um novo mandato de cinco anos com uma meta maior.`, reservas: `Ficou a ${r.meta - r.rtb} MW da meta. O Comité renova, mas a confiança desce para ${G.confianca}.`, falhado: `Ficou com ${r.rtb} de ${r.meta} MW. O Comité decide não renovar.` }[f.veredito];
    return `<div class="inner"><div class="title">${tit}<small>Mandato ${r.n} · ${r.ate}</small></div><p style="max-width:65ch">${txt}</p>
      <div class="box"><dl class="kv"><dt>MW em RtB</dt><dd>${r.rtb} / ${r.meta}</dd><dt>Valor criado</dt><dd>${M(r.valor)}</dd><dt>Confiança</dt><dd>${G.confianca}/100</dd><dt>Vendas</dt><dd>${G.vendas.length}</dd></dl></div>
      <div class="row">${f.veredito !== 'falhado' ? '<button class="btn pri" data-act="novoMandato">Aceitar novo mandato</button><button class="btn" data-act="sairCarreira">Sair e começar outra carreira</button>' : '<button class="btn pri" data-act="sairCarreira">Começar outra carreira</button>'}</div></div>`;
  }
  return `<div class="inner"><div class="title">Despedido<small>${r.ate}</small></div><p>${esc(f.porque)}</p><div class="box"><dl class="kv"><dt>MW em RtB neste mandato</dt><dd>${r.rtb} / ${r.meta}</dd><dt>Valor criado</dt><dd>${M(r.valor)}</dd></dl></div><div class="row"><button class="btn pri" data-act="sairCarreira">Começar outra carreira</button></div></div>`;
}

/* ---------- arranque ---------- */
function mostrarInicio() {
  $('#app').hidden = true; $('#fim').hidden = true; const st = $('#start'); st.hidden = false;
  let tem = false; try { tem = !!localStorage.getItem(SAVE_KEY); } catch (_) { /* nada */ }
  let hof = []; try { hof = JSON.parse(localStorage.getItem(HOF_KEY) || '[]'); } catch (_) { /* nada */ }
  st.innerHTML = `<div class="inner">
    <div class="title">IPP Manager<small>Country manager · Portugal · mandato de 400 MW em cinco anos</small></div>
    <p style="max-width:68ch;margin:0">Uma casa-mãe estrangeira quer entrar no solar português. Você chega sem terrenos, sem rede e com três pessoas. Tem cinco anos para levar 400 MW a pronto a construir. Os rivais não esperam por si.</p>
    ${tem ? '<div class="row"><button class="btn pri" data-act="continuarSave">Continuar a carreira guardada</button><span class="note">ou comece uma nova abaixo</span></div>' : ''}
    <div class="box"><h3>Nova carreira</h3>
      <div class="form" style="margin-top:8px">
        <label for="sManager">O seu nome<input type="text" id="sManager" value="Pedro" autocomplete="off"></label>
        <label for="sEmpresa">Nome da empresa<input type="text" id="sEmpresa" value="Watt Indeferido" autocomplete="off"></label>
        <label for="sSeed">Semente do mundo<span class="row" style="flex-wrap:nowrap"><input type="text" id="sSeed" value="${Math.floor(Math.random() * 99999)}" autocomplete="off" style="flex:1;min-width:0"><button class="btn mini" data-act="novaSemente" type="button">Outra</button></span></label>
      </div>
      <p class="dim" style="margin:14px 0 6px">Casa-mãe</p>
      <div class="opt">${Object.entries(TIERS).map(([k, t], i) => `<label><input type="radio" name="tier" value="${k}" ${i === 0 ? 'checked' : ''}><b>${t.nome}</b>${t.desc} Orçamento base ${M(t.orc)}/ano.</label>`).join('')}</div>
      <p class="dim" style="margin:14px 0 6px">Tipo de mandato</p>
      <div class="opt">${Object.entries(TIPOS).map(([k, t], i) => `<label><input type="radio" name="tipo" value="${k}" ${i === 0 ? 'checked' : ''}><b>${t.nome}</b>${t.desc}</label>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn pri" data-act="comecar">Começar carreira</button><span class="note">O jogo guarda sozinho neste navegador.</span></div>
    </div>
    <div class="box"><h3>Como se joga</h3><p style="margin:0;max-width:72ch">Cada clique em <b>Continuar</b> é um mês. Junte <b>capacidade de rede</b> (TRC) e <b>terrenos</b> da mesma subestação na mesa de montagem para criar um projeto. O projeto passa por estudos, avaliação ambiental e licenças até ficar <b>pronto a construir (RtB)</b>. A equipa que contrata muda as probabilidades. O Comité revê a sua confiança todos os janeiros.</p></div>
    ${hof.length ? `<div class="box"><h3>Galeria de managers</h3><table><tbody>${hof.slice(0, 8).map((h) => `<tr><td>${esc(h.manager)} · ${esc(h.empresa)}</td><td class="num">${h.rtb} MW</td><td class="num">${M(h.valor)}</td><td>${esc(h.desfecho)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <p class="note">Protótipo v0.1. Empresas rivais e pessoas são fictícias. Prazos e valores económicos são hipóteses por calibrar.</p>
  </div>`;
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  if (el.tagName === 'A') ev.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener('change', (ev) => { const el = ev.target; if (el.dataset && el.dataset.act === 'filtro') ACT.filtro(el.dataset, el); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id && ev.target.id.startsWith('lance-')) { ACT.lance({ id: ev.target.id.slice(6) }); } });

function boot(data) {
  if (data && data.G) { G = data.G; Object.assign(UI, data.UI || {}); $('#start').hidden = true; $('#app').hidden = false; render(); return; }
  if (carregar()) { $('#start').hidden = true; $('#app').hidden = false; render(); } else mostrarInicio();
}
window.claude?.hot?.snapshot?.(() => ({ G, UI: { view: UI.view, ficha: UI.ficha, sel: UI.sel, f: UI.f, tab: UI.tab, sort: UI.sort } }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
