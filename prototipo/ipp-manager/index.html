<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPP Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: consola de gestão clássica (CM 01/02): barra de topo com data e caixa, menu de secções à esquerda,
   painel central de listas ordenáveis e fichas. Um só visual escuro, escolhido de propósito. */
:root {
  --bg: #0e1a2b;        /* fundo da consola */
  --panel: #142538;     /* painéis */
  --panel2: #1a2f48;    /* cabeçalhos de tabela, hover */
  --line: #284565;      /* filetes */
  --fg: #dde7f2;        /* texto */
  --dim: #8ea5c0;       /* texto secundário */
  --accent: #f2b33d;    /* âmbar solar: ação principal, destaques */
  --link: #84c7ff;      /* ligações e linhas clicáveis */
  --good: #63d391;
  --bad: #ff8070;
  --warn: #f2b33d;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'IBM Plex Sans Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num, td.n, th.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
h1, h2, h3 { font-family: var(--f-disp); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }

/* App */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; background: var(--panel); border-bottom: 2px solid var(--accent);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-disp); font-weight: 700; font-size: 1.35rem; letter-spacing: .04em; color: var(--accent); text-transform: uppercase; }
.brand small { color: var(--dim); font-weight: 500; font-size: .85rem; margin-left: 6px; letter-spacing: .03em; }
.hud { display: flex; flex-wrap: wrap; gap: 4px 16px; flex: 1; min-width: 0; }
.hud div { display: flex; flex-direction: column; line-height: 1.15; }
.hud b { font-family: var(--f-mono); font-weight: 500; font-size: .95rem; }
.hud span { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.go { display: flex; gap: 6px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 11px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--link); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--accent); color: #1b1404; border-color: var(--accent); font-weight: 600; }
.btn.pri:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn.mini { padding: 2px 8px; font-size: .85rem; }
.btn.danger { border-color: #7a3a33; }
.main { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
nav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding-block: 8px; }
nav .grp { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); padding: 10px 16px 3px; }
nav button { display: flex; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; cursor: pointer; border-left: 3px solid transparent; }
nav button:hover { background: var(--panel2); }
nav button.on { background: var(--panel2); border-left-color: var(--accent); color: #fff; }
nav .badge { font-family: var(--f-mono); font-size: .75rem; background: var(--accent); color: #1b1404; border-radius: 8px; padding: 0 6px; }
#view { overflow-y: auto; min-width: 0; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vh { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.vh p { margin: 2px 0 0; color: var(--dim); max-width: 75ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); align-items: start; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; min-width: 0; }
.box > h3 { margin-bottom: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.c i { background: var(--link); }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th { background: var(--panel2); color: var(--dim); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; text-align: left; padding: 6px 8px; white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; }
th.ns { cursor: default; }
td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--panel2); }
tr.click td:first-child { color: var(--link); }
tr.off td { color: var(--dim); }
.tag { display: inline-block; font-size: .72rem; padding: 0 5px; border-radius: 2px; border: 1px solid var(--line); color: var(--dim); margin-right: 3px; white-space: nowrap; }
.tag.r { border-color: #7a3a33; color: var(--bad); }
.tag.g { border-color: #2f6b4b; color: var(--good); }
.tag.a { border-color: #6d5420; color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
select, input[type=text], input[type=number] { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; }
input[type=number] { width: 6.5em; }
.attr { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.av { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.av.hi { color: var(--good); } .av.lo { color: var(--bad); }
.back { margin-bottom: 10px; }
.note { font-size: .82rem; color: var(--dim); }
.msg { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--panel2); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.tabs button { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; cursor: pointer; color: var(--dim); }
.tabs button.on { color: var(--fg); border-color: var(--accent); }

/* Caixa de entrada */
.inbox { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 14px; align-items: start; }
.mlist { max-height: calc(100vh - 190px); overflow-y: auto; }
.mitem { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 10px; cursor: pointer; }
.mitem:hover, .mitem.on { background: var(--panel2); }
.mitem .s { display: block; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mitem.unread .s { font-weight: 600; color: #fff; }
.mitem .m { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--dim); }
.mitem .dot { color: var(--accent); }
.mail h2 { font-size: 1.35rem; margin: 2px 0 6px; }
.mail .from { color: var(--dim); font-size: .85rem; margin-bottom: 10px; }
.mail .body p { margin: 0 0 8px; max-width: 72ch; }
.mail .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* Ecrãs de arranque e fim */
.overlay { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 20;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.overlay .inner { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; }
.title { font-family: var(--f-disp); font-weight: 700; font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: .95; letter-spacing: .01em; text-transform: uppercase; color: var(--accent); }
.title small { display: block; font-size: .32em; color: var(--dim); letter-spacing: .12em; margin-top: 8px; }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.form label { display: grid; gap: 3px; font-size: .8rem; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.form label input, .form label select { text-transform: none; letter-spacing: 0; color: var(--fg); font-size: .95rem; padding: 6px 8px; }
.opt { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.opt label { border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; cursor: pointer; background: var(--panel); text-transform: none; letter-spacing: 0; color: var(--fg); font-size: .9rem; display: block; }
.opt label:has(input:checked) { border-color: var(--accent); }
.opt b { display: block; font-family: var(--f-disp); font-size: 1.1rem; font-weight: 600; }
.opt input { margin-right: 6px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); background: var(--panel2); border: 1px solid var(--accent); padding: 8px 12px; border-radius: 3px; z-index: 30; max-width: min(420px, calc(100vw - 32px)); }
.spark { width: 100%; height: 60px; display: block; }

@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { display: flex; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; }
  nav .grp { display: none; }
  nav button { width: auto; white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; gap: 6px; padding: 8px 12px; }
  nav button.on { border-bottom-color: var(--accent); }
  .inbox { grid-template-columns: 1fr; }
  .top .hud { order: 3; flex-basis: 100%; gap: 4px 14px; }
  .go { margin-left: auto; }
  .mlist { max-height: 40vh; }
  #app { height: auto; min-height: 100%; }
  .main { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div class="brand">IPP Manager<small id="hEmp"></small></div>
    <div class="hud" id="hud"></div>
    <div class="go">
      <button class="btn" id="btnAte" data-act="ateNovidade" title="Avança mês a mês até chegar um email que pede decisão (máx. 6 meses)">Até haver novidades</button>
      <button class="btn pri" id="btnGo" data-act="continuar">Continuar ▸</button>
    </div>
  </header>
  <div class="main">
    <nav id="nav"></nav>
    <section id="view" aria-live="polite"></section>
  </div>
</div>
<div id="start" class="overlay"></div>
<div id="fim" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ============================================================
   IPP Manager · protótipo v0.1
   Valores económicos e prazos: HIPÓTESE (por calibrar). Empresas rivais e pessoas: fictícias.
   ============================================================ */
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const ANO0 = 2027;
const SAVE_KEY = 'ippm.save.v1', HOF_KEY = 'ippm.hof.v1';

const TIERS = {
  boutique: { nome: 'Boutique', orc: 3.0, desc: 'Casa-mãe pequena. Orçamento curto, pouca margem para erros.' },
  medio: { nome: 'Meia-tabela', orc: 4.5, desc: 'Fundo de dimensão média. Dá para arriscar um pouco.' },
  infra: { nome: 'Fundo de infraestrutura', orc: 7.0, desc: 'Orçamento folgado, Comité impaciente.' }
};
const TIPOS = {
  vender: { nome: 'Desenvolver e vender', desc: 'Ganha-se a levar projetos a RtB e a vendê-los com lucro.' },
  operar: { nome: 'Construir e operar', desc: 'Ganha-se a construir e a ter MW a produzir. A casa-mãe põe o capital.' }
};
const ATR = [['ter','Terrenos'],['lic','Licenciamento'],['rede','Rede elétrica'],['amb','Ambiente'],['fin','Finanças'],['neg','Negociação']];
const ATRN = Object.fromEntries(ATR);
const FUNCOES = { ter: 'Landman (terrenos)', lic: 'Gestor de licenciamento', rede: 'Engenheiro de rede', amb: 'Especialista ambiental', fin: 'Analista financeiro', neg: 'Negociador' };

// id, nome, região, kV, MW livres, irradiância kWh/kWp, câmara, sensibilidade ambiental 0..1
const SE_DEF = [
  ['ourique','Ourique','Baixo Alentejo',400,120,1880,'hostil',0.5],
  ['ferreira','Ferreira do Alentejo','Baixo Alentejo',150,60,1860,'favoravel',0.3],
  ['evora','Évora','Alentejo Central',400,90,1840,'neutra',0.45],
  ['estremoz','Estremoz','Alentejo Central',400,70,1800,'neutra',0.35],
  ['falagueira','Falagueira','Alto Alentejo',400,140,1760,'favoravel',0.3],
  ['pego','Pego','Médio Tejo',400,100,1720,'neutra',0.25],
  ['tavira','Tavira','Algarve',150,40,1920,'hostil',0.6],
  ['portimao','Portimão','Algarve',150,50,1900,'neutra',0.55],
  ['alqueva','Alqueva','Baixo Alentejo',400,80,1870,'favoravel',0.65],
  ['sines','Sines','Alentejo Litoral',400,60,1820,'neutra',0.5],
  ['pontesor','Ponte de Sor','Alto Alentejo',150,90,1770,'favoravel',0.2],
  ['fundao','Fundão','Beira Interior',220,70,1650,'neutra',0.3],
  ['cbranco','Castelo Branco','Beira Interior',220,80,1680,'favoravel',0.35],
  ['riomaior','Rio Maior','Oeste',400,50,1650,'neutra',0.3]
];
const CAMARA = { hostil: 'Hostil', neutra: 'Neutra', favoravel: 'Favorável' };

// id, nome, estilo, descrição, caixa inicial (M€), entrada mensal (M€), qualidade da equipa
const RIVAIS_DEF = [
  ['solenor','Solenor Ibérica','agressivo','Promotor espanhol com pressa de crescer em Portugal. Paga bem e arrisca.',3.5,0.30,12],
  ['valeverde','Vale Verde Energia','cauteloso','IPP português de família. Só avança com terra e rede garantidas.',2.5,0.18,13],
  ['atlantica','Atlântica Renováveis','oportunista','Compra o que os outros deixam cair. Vende depressa.',2.0,0.18,10],
  ['helios','Helios Capital','fundo','Fundo de infraestrutura. Compra projetos RtB e opera-os.',9,0.45,11],
  ['lusowatt','Lusowatt','agressivo','Startup de Lisboa, muito alavancada.',1.2,0.12,9],
  ['tejo','Grupo Tejo Energia','utility','Utility histórica. Lenta, mas com um balanço enorme.',10,0.55,14]
];
const ESTILO = {
  agressivo: { nome: 'Agressivo', novo: 0.13, vende: 0.35, lance: 1.3 },
  cauteloso: { nome: 'Cauteloso', novo: 0.05, vende: 0.08, lance: 0.8 },
  oportunista: { nome: 'Oportunista', novo: 0.05, vende: 0.5, lance: 0.9 },
  fundo: { nome: 'Fundo comprador', novo: 0.02, vende: 0, lance: 1.0 },
  utility: { nome: 'Utility', novo: 0.07, vende: 0, lance: 1.15 }
};
const DEVS = ['Sunterra Lda','Monte Solar Unipessoal','Eira Energia','Planície Power','Brisa do Sul Projetos','Lumen Desenvolvimento'];

// Fases do projeto. meses e custo (M€) são HIPÓTESE.
const FASES = [
  { id: 'estudos', nome: 'Estudos e PIP', curto: 'Estudos', meses: 4, custo: 0.12, p: 0.92, sk: 'lic' },
  { id: 'ambiente', nome: 'Avaliação ambiental', curto: 'Ambiente', meses: 10, custo: 0.35, p: 0.72, sk: 'amb' },
  { id: 'licenca', nome: 'Licença de produção e municipal', curto: 'Licenças', meses: 6, custo: 0.20, p: 0.85, sk: 'lic' },
  { id: 'rtb', nome: 'Pronto a construir (RtB)', curto: 'RtB' },
  { id: 'construcao', nome: 'Em construção', curto: 'Construção', meses: 12 },
  { id: 'operacao', nome: 'Em operação', curto: 'Operação' }
];
const CAUCAO_MW = 0.005;   // M€/MW (5 k€/MW), HIPÓTESE
const PRAZO_TRC = 42;      // meses do TRC até RtB, HIPÓTESE
const CAPEX_MWP = 0.48;    // M€/MWp, HIPÓTESE

const NOMES = ['Ana','Beatriz','Carla','Daniela','Filipa','Helena','Inês','Joana','Leonor','Mariana','Marta','Patrícia','Rita','Sofia','Teresa','Vera','Catarina','Raquel','Lívia','Graça','André','Bruno','Diogo','Duarte','Filipe','Gonçalo','Hugo','João','Luís','Miguel','Nuno','Paulo','Ricardo','Rui','Tiago','Vasco','Henrique','Sérgio','Abel','Teodoro','Tomé','Leonel'];
const APELIDOS = ['Valadares','Barroca','Amarante','Carriço','Tavolim','Quintanilha','Belmonte','Sarzedas','Cotovio','Ferraria','Pombeiro','Bragadas','Vidigal','Calvinho','Alcaide','Courelas','Galvão','Lagoa','Monsaraz','Nogueira','Pacheco','Raposo','Serrano','Tojal','Valente','Zambujal','Canhoto','Pinheiro','Matias','Godinho','Prates','Murteira','Fragoso','Arnoia','Seixal','Corgas'];
const LUGARES = ['do Freixo','da Azinheira','dos Gaviões','do Monte Novo','da Lameira','das Cegonhas','do Pinheiro Manso','da Courela Velha','do Barranco','das Figueiras','da Serra Pelada','do Vale da Rosa','dos Alfaiates','da Amendoeira','do Carrascal','da Defesa','do Rossio','das Mós','do Zambujeiro','da Fonte Santa','dos Machados','da Carapinha','do Sobral','da Atalaia','das Pereiras','do Montinho'];

/* ---------- utilitários ---------- */
let G = null;
const UI = { view: 'painel', ficha: null, sel: null, sort: {}, f: {}, tab: {}, msg: null, confirm: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hashSeed(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h | 0; }
function rnd() { G.rng = (G.rng + 0x6D2B79F5) | 0; let t = G.rng; t = Math.imul(t ^ (t >>> 15), 1 | t); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = (a) => a[Math.floor(rnd() * a.length)];
const chance = (p) => rnd() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const mesLabel = (m) => MESES[((m % 12) + 12) % 12] + ' ' + (ANO0 + Math.floor(m / 12));
const anoDe = (m) => ANO0 + Math.floor(m / 12);
const nf = (v, d = 2) => Number(v).toLocaleString('pt-PT', { minimumFractionDigits: d, maximumFractionDigits: d });
const M = (v) => nf(v, 2) + ' M€';
const K = (v) => nf(v * 1000, 0) + ' k€';
const pct = (p) => Math.round(p * 100) + ' %';
const sub = (id) => G.subs.find((s) => s.id === id);
const rival = (id) => G.rivais.find((r) => r.id === id);
const pessoa = (id) => G.pessoas.find((p) => p.id === id);
const terreno = (id) => G.terrenos.find((t) => t.id === id);
const trc = (id) => G.trcs.find((t) => t.id === id);
const projeto = (id) => G.projetos.find((p) => p.id === id);
const nid = (p) => p + (G.nid++);
const anoMandato = () => Math.floor((G.mes - G.mandato.inicio) / 12);

/* ---------- livro de caixa ---------- */
function conta(cat, v) { const a = anoDe(G.mes); G.contas[a] = G.contas[a] || {}; G.contas[a][cat] = (G.contas[a][cat] || 0) + v; }
function despesa(v, cat) { G.caixa -= v; G.gastoAno += v; conta(cat, -v); }
function receita(v, cat) { G.caixa += v; conta(cat, v); }

const minhaEquipa = () => G.pessoas.filter((p) => p.onde === 'jogador');
function forte(k) {
  const v = minhaEquipa().map((p) => p.a[k]).sort((a, b) => b - a);
  if (!v.length) return 5;
  return clamp(Math.max(5, v[0] + 0.15 * v.slice(1).reduce((s, x) => s + x, 0)), 1, 20);
}
const temFuncao = (k, min) => minhaEquipa().some((p) => p.a[k] >= (min || 9));
const salariosMes = () => minhaEquipa().reduce((s, p) => s + p.salario, 0) / 12 / 1000;

function novaPessoa(onde, funcao, fixo) {
  const f = funcao || pick(Object.keys(FUNCOES));
  const a = {}; ATR.forEach(([k]) => { a[k] = ri(2, 10); });
  a[f] = ri(8, 18);
  const sec = pick(ATR.map((x) => x[0]).filter((k) => k !== f)); a[sec] = Math.max(a[sec], ri(6, 13));
  let nome; do { nome = pick(NOMES) + ' ' + pick(APELIDOS); } while (G.pessoas.some((p) => p.nome === nome));
  const p = { id: nid('P'), nome, idade: ri(26, 58), funcao: f, a, ambicao: ri(3, 19), lealdade: ri(3, 19), potencial: 0, onde, rel: false, vis: {}, desde: G.mes, bloqueio: 0 };
  if (fixo) Object.assign(p, fixo);
  p.potencial = Math.min(20, p.a[p.funcao] + (p.idade < 36 ? ri(1, 5) : ri(0, 1)));
  p.salario = Math.round(40 + p.a[p.funcao] * 4.2 + p.a[sec] * 1.2 + (p.idade > 45 ? 10 : 0) + ri(-6, 10));
  ATR.forEach(([k]) => { const v = p.a[k]; p.vis[k] = [Math.max(1, v - ri(1, 5)), Math.min(20, v + ri(1, 5))]; });
  return p;
}
function attrTxt(p, k) {

  const [lo, hi] = p.vis[k];
  return lo === hi ? String(lo) : lo + '–' + hi;

function attrCls(p, k) { const v = p.rel ? p.a[k] : (p.vis[k][0] + p.vis[k][1]) / 2; return v >= 15 ? 'hi' : v <= 6 ? 'lo' : ''; }
function ondeTxt(p) { if (p.onde === 'livre') return 'Livre'; if (p.onde === 'jogador') return G.empresa; const r = rival(p.onde.slice(6)); return r ? r.nome : '—'; }

function rivalNovo(r, s, mw, fi, inicial, semRede) {
  if (!s || mw <= 0) return null;
  if (!semRede) s.livre = Math.max(0, s.livre - mw);
  const t = G.terrenos.filter((x) => x.se === s.id && x.estado === 'mercado').sort((a, b) => b.irr - a.irr)[0];
  if (t) { t.estado = 'rival:' + r.id; t.uso = r.id; }
  s.calor = Math.min(100, s.calor + 7);
  const p = { id: nid('R'), se: s.id, mw, fi: fi || 0, rest: FASES[fi || 0].meses || 0, terreno: t ? t.id : null, tent: 0, nome: nomeProjeto(s) };
  r.projetos.push(p);
  if (p.fi === 3) { r.mwRtb += mw; r.mwDev += mw; p.rtbMes = G.mes; }
  if (!inicial) r.caixa -= 0.25;
  return p;
}
function nomeProjeto(s) { G.nomesProj[s.id] = (G.nomesProj[s.id] || 0) + 1; const n = G.nomesProj[s.id]; return 'Solar ' + s.nome + (n > 1 ? ' ' + ['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n] : ''); }

function arranqueAno(primeiro) {
  const t = TIERS[G.tier];
  const orc = Math.round(t.orc * (0.6 + G.confianca / 100 * 0.8) * 10) / 10;
  G.orcamentoAno = orc; G.gastoAno = 0;
  receita(orc, 'Orçamento da casa-mãe'); G.capitalRecebido += orc;

  if (!primeiro) email({ de: 'Comité de Investimento', assunto: `Orçamento e objetivos para ${anoDe(G.mes)}`, tipo: 'comite', imp: true, corpo:
    `<p>Aprovámos um orçamento de desenvolvimento de <b>${M(orc)}</b> para ${anoDe(G.mes)}, já transferido.</p><p>Objetivos do ano:</p><ul>${G.objetivos.map((o) => `<li>${esc(o.txt)}</li>`).join('')}</ul>` });
}
function gerarObjetivos() {
  const y = anoMandato(), m = G.mandato.meta, out = [];
  const r10 = (v) => Math.max(10, Math.round(v / 10) * 10);
  if (y === 0) { out.push({ tipo: 'trc', alvo: r10(m * 0.25), txt: `Garantir pelo menos ${r10(m * 0.25)} MW de capacidade de rede` }); out.push({ tipo: 'terra', alvo: r10(m * 0.3), txt: `Ter opções de terreno com pelo menos ${r10(m * 0.3)} MWp` }); }
  if (y === 1) { out.push({ tipo: 'trc', alvo: r10(m * 0.6), txt: `Ter pelo menos ${r10(m * 0.6)} MW de capacidade de rede` }); out.push({ tipo: 'amb', alvo: r10(m * 0.3), txt: `Ter pelo menos ${r10(m * 0.3)} MW em avaliação ambiental ou mais à frente` }); }
  if (y === 2) out.push({ tipo: 'rtb', alvo: r10(m * 0.2), txt: `Chegar a ${r10(m * 0.2)} MW em RtB neste mandato` });
  if (y === 3) { out.push({ tipo: 'rtb', alvo: r10(m * 0.55), txt: `Chegar a ${r10(m * 0.55)} MW em RtB neste mandato` }); out.push(G.tipo === 'vender' ? { tipo: 'venda', alvo: 1, txt: 'Vender pelo menos um projeto' } : { tipo: 'obra', alvo: 1, txt: 'Ter pelo menos um projeto em construção ou operação' }); }
  if (y >= 4) out.push({ tipo: 'rtb', alvo: m, txt: `Cumprir o mandato: ${m} MW em RtB` });
  out.push({ tipo: 'orc', alvo: Math.round(G.orcamentoAno * 1.1 * 10) / 10, txt: `Não gastar mais de ${M(Math.round(G.orcamentoAno * 1.1 * 10) / 10)} em desenvolvimento` });
  return out;
}
function mwTrc() { return G.trcs.filter((t) => t.estado === 'ativo').reduce((s, t) => s + t.mw, 0); }
function mwpTerra() { return G.terrenos.filter((t) => t.estado === 'jogador').reduce((s, t) => s + t.mwp, 0); }
const projAtivos = () => G.projetos.filter((p) => p.estado === 'ativo');
function avaliarObj(o) {
  switch (o.tipo) {
    case 'trc': return [mwTrc(), mwTrc() >= o.alvo];
    case 'terra': return [mwpTerra(), mwpTerra() >= o.alvo];
    case 'amb': { const v = projAtivos().filter((p) => p.fi >= 1).reduce((s, p) => s + p.mwac, 0) + G.projetos.filter((p) => p.estado === 'vendido').reduce((s, p) => s + p.mwac, 0); return [v, v >= o.alvo]; }
    case 'rtb': return [G.mandato.rtb, G.mandato.rtb >= o.alvo];
    case 'venda': { const v = G.vendas.filter((x) => x.mes >= G.mandato.inicio).length; return [v, v >= o.alvo]; }
    case 'obra': { const v = G.projetos.filter((p) => p.estado === 'ativo' && p.fi >= 4).length; return [v, v >= o.alvo]; }
    case 'orc': return [G.gastoAno, G.gastoAno <= o.alvo];
  }
  return [0, false];
}
function revisaoAnual() {
  // corre no início de janeiro: avalia o ano que acabou
  const linhas = []; let d = 0;
  G.objetivos.forEach((o) => { const [v, ok] = avaliarObj(o); d += ok ? (o.tipo === 'orc' ? 4 : 8) : -12; linhas.push({ txt: o.txt, v, ok }); });
  const ano = anoDe(G.mes - 1);
  mudaConf(d, `Revisão anual de ${ano}`);
  G.avaliacoes.push({ ano, linhas, conf: G.confianca, d });
  email({ de: 'Comité de Investimento', assunto: `Revisão anual de ${ano}: confiança ${d >= 0 ? 'sobe' : 'desce'} para ${G.confianca}`, tipo: 'comite', imp: true, corpo:
    `<p>Avaliámos o seu ano.</p><ul>${linhas.map((l) => `<li>${l.ok ? '✔' : '✘'} ${esc(l.txt)} <span class="dim">(${typeof l.v === 'number' ? nf(l.v, l.v % 1 ? 2 : 0) : l.v})</span></li>`).join('')}</ul>
     <p>A nossa confiança passa a <b>${G.confianca}/100</b>.${G.confianca < 25 ? ' Estamos a perder a paciência.' : ''}</p>` });
}

function novaListagemProjeto(vendedor, se, mw, fi) {

    ha: Math.round(mwac * 1.25 * 1.5), irr: s.irr + ri(-30, 30), renda: Math.round((750 + s.calor * 8) / 10) * 10 };

}

/* ---------- valor ---------- */
function irrProj(p) { return p.irr || 1800; }
function rendaPen(p) { return p.terrenos.map(terreno).filter(Boolean).reduce((s, t) => s + t.ha * t.renda, 0) * 8 / 1e6; }
function valorProjeto(p) {
  if (p.estado !== 'ativo') return 0;
  const f = FASES[p.fi].id;
  const base = { estudos: 0.018, ambiente: 0.03, licenca: 0.055, rtb: G.mercado.rtb, construcao: G.mercado.rtb, operacao: G.mercado.rtb }[f];
  const eq = p.fi === 4 ? (p.eq || 0) : p.fi === 5 ? (p.eq || 0) * 1.3 : 0;
  return Math.max(0, p.mwac * base * irrProj(p) / 1800 - rendaPen(p) * (p.fi >= 3 ? 1 : 0.4)) + eq;
}
function cauçõesPresas() {
  let v = G.trcs.filter((t) => t.estado === 'ativo' && !t.devolvida).reduce((s, t) => s + t.caucao, 0);
  v += G.tarefas.filter((t) => t.tipo === 'pedido').reduce((s, t) => s + t.caucao, 0);
  if (G.leilao && G.leilao.estado === 'aberto') v += G.leilao.lotes.reduce((s, l) => s + (l.meu ? l.mw * CAUCAO_MW : 0), 0);
  return v;
}
function valorCarteira() {
  let v = projAtivos().reduce((s, p) => s + valorProjeto(p), 0);
  v += G.trcs.filter((t) => t.estado === 'ativo' && !t.projeto).reduce((s, t) => s + t.mw * 0.012, 0);
  v += G.terrenos.filter((t) => t.estado === 'jogador' && !t.uso).reduce((s, t) => s + t.opcao, 0);
  return v;
}
function valorCriado() { return G.caixa + valorCarteira() + cauçõesPresas() - G.capitalRecebido - (G.divida ? G.divida.saldo : 0); }

/* ---------- probabilidades de fase ---------- */
function probFase(p, fi) {
  const F = FASES[fi]; const s = sub(p.se);
  let pr = F.p + (forte(F.sk) - 10) * 0.02 + (p.mod[F.id] || 0);
  const ts = p.terrenos.map(terreno).filter(Boolean);
  const probl = (k) => ts.some((t) => t.h[k]);
  const sabe = (k) => ts.some((t) => t.h[k] && t.dd && t.dd.achados.includes(k));
  const pen = (k, v) => (probl(k) ? (sabe(k) ? v / 2 : v) : 0);
  if (F.id === 'estudos') pr -= pen('titulos', 0.16);
  if (F.id === 'ambiente') { pr -= s.amb * 0.2; if (ts.some((t) => t.natura)) pr -= 0.12; if (ts.some((t) => t.ren)) pr -= 0.06; pr -= pen('arqueo', 0.1) + pen('montado', 0.12); }
  if (F.id === 'licenca') { pr += s.camara === 'hostil' ? -0.12 : s.camara === 'favoravel' ? 0.06 : 0; if (ts.some((t) => t.ran)) pr -= 0.05; }
  if (p.risco && !p.riscoMitigado && F.id === 'ambiente') pr -= 0.15;
  return clamp(pr, 0.1, 0.97);
}
// probabilidade "vista" pelo jogador: sem DD, os problemas escondidos não entram na conta
function probVista(p, fi) {
  const F = FASES[fi]; const s = sub(p.se);
  let pr = F.p + (forte(F.sk) - 10) * 0.02 + (p.mod[F.id] || 0);
  const ts = p.terrenos.map(terreno).filter(Boolean);
  const achou = (k) => ts.some((t) => t.dd && t.dd.achados.includes(k));
  if (F.id === 'estudos' && achou('titulos')) pr -= 0.08;
  if (F.id === 'ambiente') { pr -= s.amb * 0.2; if (ts.some((t) => t.natura)) pr -= 0.12; if (ts.some((t) => t.ren)) pr -= 0.06; if (achou('arqueo')) pr -= 0.05; if (achou('montado')) pr -= 0.06; }
  if (F.id === 'licenca') { pr += s.camara === 'hostil' ? -0.12 : s.camara === 'favoravel' ? 0.06 : 0; if (ts.some((t) => t.ran)) pr -= 0.05; }
  if (p.riscoConhecido && !p.riscoMitigado && F.id === 'ambiente') pr -= 0.15;
  return clamp(pr, 0.1, 0.97);
}
function duracao(fi) { const F = FASES[fi]; let d = F.meses * (1.25 - forte(F.sk) * 0.025); if (F.sk === 'lic' && G.mes <= G.mods.licAte) d *= G.mods.licDur; return Math.max(2, Math.round(d)); }
function custoFase(p, fi) { return FASES[fi].custo * (p.mwac / 100 * 0.5 + 0.5) * (p.desconto || 1); }

/* ============================================================
   O MÊS: o mundo mexe-se
   ============================================================ */
function avancar() {
  if (!G || G.fim) return;
  // custos fixos do mês que acaba
  despesa(salariosMes(), 'Salários');
  if (G.divida) { despesa(G.divida.prestacao, 'Juros e amortização'); G.divida.saldo = Math.max(0, G.divida.saldo - G.divida.prestacao * 0.8); if (--G.divida.meses <= 0) G.divida = null; }
  G.mes++;
  const m = G.mes % 12;
  if (m === 0) revisaoAnual();
  if (G.confianca <= 0) return fimCarreira('despedido', 'O Comité perdeu a confiança em si.');
  if (G.mes >= G.mandato.fim) return fimMandato();
  if (m === 0) arranqueAno(false);
  mercadoTick();
  tarefasTick();
  projetosTick();
  trcsTick();
  rivaisTick();
  subsTick();
  listagensTick();
  pessoasTick();
  leilaoTick(m);
  eventos();
  caixaTick();
  if (G.confianca <= 0 && !G.fim) fimCarreira('despedido', 'O Comité perdeu a confiança em si.');
  hist();
}

function novoTrc(se, mw, origem, caucao, sem) {

  G.trcs.push(t); return t;
}

function projetosTick() {
  G.projetos.forEach((p) => {
    if (p.estado !== 'ativo' || p.bloqueado) return;
    if (p.fi <= 2) {
      if (!p.pago) {
        if (p.pausado) return;
        const c = custoFase(p, p.fi);
        if (G.caixa < c) { if (!p.semCaixa) { p.semCaixa = true; email({ de: 'Tiago Nunes · Finanças', assunto: `${p.nome} parado: falta caixa`, tipo: 'projeto', imp: true, link: { tipo: 'projeto', id: p.id }, corpo: `<p>A fase «${FASES[p.fi].nome}» custa ${M(c)} e não temos caixa. O projeto fica parado até haver dinheiro.</p>` }); } return; }
        despesa(c, 'Desenvolvimento de projetos'); p.custo += c; p.pago = true; p.semCaixa = false; p.desconto = 1; p.rest = duracao(p.fi);
        p.log.push(`${mesLabel(G.mes)}: início de «${FASES[p.fi].nome}» (${M(c)})`);
        return;
      }
      p.rest--;
      if (p.rest <= 0) resolverFase(p);
    } else if (p.fi === 4) {
      p.rest--;
      if (p.rest > 0 && chance(0.03)) { p.rest += 2; email({ de: 'Obra', assunto: `${p.nome}: atraso de 2 meses`, tipo: 'projeto', corpo: `<p>${pick(['Chuva intensa parou a terraplanagem.', 'O transformador chegou com defeito.', 'Furto de cabo no estaleiro.'])} A entrada em operação passa para ${mesLabel(G.mes + p.rest)}.</p>` }); }
      if (p.rest <= 0) { p.fi = 5; p.log.push(`${mesLabel(G.mes)}: entrada em operação`); mudaConf(4, `${p.nome} em operação`); noticia(`${p.nome} (${G.empresa}) entra em operação com ${p.mwp} MWp.`, 'jogador'); email({ de: 'Obra', assunto: `${p.nome} em operação`, tipo: 'projeto', imp: true, corpo: `<p>Primeira injeção na rede. ${p.mwp} MWp a produzir.</p>` }); }
    } else if (p.fi === 5) {
      receita(p.mwp * irrProj(p) * G.mercado.preco * 0.3 / 12 / 1e6, 'Receitas de operação');

function resolverFase(p) {
  const F = FASES[p.fi]; const pr = probFase(p, p.fi);
  if (chance(pr)) {
    p.log.push(`${mesLabel(G.mes)}: «${F.nome}» aprovada`);
    p.fi++; p.pago = false; p.tentFase = 0;
    if (p.fi === 3) atingirRtb(p);
    else if (F.id === 'ambiente') { email({ de: 'APA', assunto: `${p.nome}: avaliação ambiental favorável`, tipo: 'projeto', link: { tipo: 'projeto', id: p.id }, corpo: '<p>A decisão ambiental é favorável (condicionada). Segue para licenciamento.</p>' }); mudaConf(2, `${p.nome}: ambiente aprovado`); }
  } else {
    p.bloqueado = true; p.tentFase = (p.tentFase || 0) + 1;
    p.log.push(`${mesLabel(G.mes)}: «${F.nome}» chumbada`);
    mudaConf(-3, `${p.nome}: ${F.curto.toLowerCase()} chumbado`);
    const pode = p.tentFase < 3;
    email({ de: F.id === 'ambiente' ? 'APA' : F.id === 'licenca' ? 'Câmara e DGEG' : 'Equipa de licenciamento', assunto: `${p.nome}: ${F.nome.toLowerCase()} recusada`, tipo: 'decisao', imp: true, link: { tipo: 'projeto', id: p.id },
      corpo: `<p>A fase «${F.nome}» do ${esc(p.nome)} foi recusada.${F.id === 'ambiente' ? ' Os pareceres apontam impactes sobre habitats e paisagem.' : F.id === 'licenca' ? ' A Câmara levantou objeções ao uso do solo.' : ' Os estudos mostraram problemas que é preciso resolver.'}</p>
      <p>${pode ? `Podemos reformular e voltar a submeter (custa metade da fase, ${M(custoFase(p, p.fi) / 2)}) ou abandonar o projeto e libertar o TRC e os terrenos para outra combinação.` : 'Já reformulámos duas vezes. Só resta abandonar.'}</p>`,
      acoes: (pode ? [{ r: 'Reformular e voltar a submeter', fn: 'reformular', a: { p: p.id } }] : []).concat([{ r: 'Abandonar o projeto', fn: 'abandonar', a: { p: p.id } }]) });
  }
}
function atingirRtb(p) {
  p.rtbMes = G.mes; G.mandato.rtb += p.mwac; G.mwRtbTotal += p.mwac;
  const t = trc(p.trc); if (t && !t.devolvida) { soltar(t.caucao); t.devolvida = true; t.cumprido = true; }
  mudaConf(5, `${p.nome} chegou a RtB`);
  noticia(`${G.empresa} leva ${p.nome} (${p.mwac} MW) a pronto a construir.`, 'jogador');
  email({ de: 'Rui Matos · Licenciamento', assunto: `${p.nome} está pronto a construir (RtB)`, tipo: 'projeto', imp: true, link: { tipo: 'projeto', id: p.id },
    corpo: `<p>Temos todas as licenças. ${p.mwac} MW contam para o mandato (${G.mandato.rtb}/${G.mandato.meta} MW). A caução do TRC foi devolvida.</p><p>${G.tipo === 'vender' ? 'Podemos pô-lo à venda na ficha do projeto. Os compradores vão aparecer.' : 'Podemos avançar para construção na ficha do projeto, ou vendê-lo se a oferta for boa.'}</p>` });
  if (chance(0.5)) gerarOfertas(p, 1);

function gerarOfertas(p, n) {
  const compradores = shuffle(G.rivais.filter((r) => r.caixa > 1 || r.estilo === 'fundo' || r.estilo === 'utility'));
  for (let i = 0; i < n && i < compradores.length; i++) {
    const r = compradores[i];
    const base = valorProjeto(p);
    const v = Math.round(base * (0.82 + rnd() * 0.3 + (forte('neg') - 10) * 0.012) * 100) / 100;
    email({ de: r.nome, assunto: `Oferta pelo ${p.nome}: ${M(v)}`, tipo: 'decisao', imp: true, link: { tipo: 'projeto', id: p.id },
      corpo: `<p>A ${esc(r.nome)} oferece <b>${M(v)}</b> pelo ${esc(p.nome)} (${p.mwac} MW, ${FASES[p.fi].curto}), ou seja ${nf(v / p.mwac * 1000, 0)} k€/MW. A oferta é válida até ao fim do mês.</p><p class="dim">Valor de mercado estimado pela equipa: ${M(valorProjeto(p))}.</p>`,
      acoes: [{ r: `Aceitar ${M(v)}`, fn: 'vender', a: { p: p.id, v, r: r.id } }, { r: 'Recusar', fn: 'recusar', a: {} }], expira: G.mes + 1 });
  }
}
function trcsTick() {
  G.trcs.forEach((t) => {
    if (t.estado !== 'ativo' || t.cumprido) return;
    const p = t.projeto && projeto(t.projeto);
    if (p && p.fi >= 3) { t.cumprido = true; return; }
    const falta = t.prazo - G.mes;
    if (falta === 6) email({ de: 'DGEG', assunto: `Aviso: TRC de ${sub(t.se).nome} caduca em 6 meses`, tipo: 'rede', imp: true, link: { tipo: 'trc', id: t.id }, corpo: `<p>O título de ${t.mw} MW em ${sub(t.se).nome} caduca em ${mesLabel(t.prazo)} se o projeto não estiver pronto a construir. Pode pedir uma prorrogação (uma vez).</p>` });
    if (falta <= 0) {
      t.estado = 'caducado'; sub(t.se).livre += t.mw; G.perdas = (G.perdas || 0) + t.caucao;
      if (p) { p.estado = 'caducado'; p.terrenos.forEach((id) => { const tr = terreno(id); if (tr) tr.uso = null; }); }
      mudaConf(-8, `TRC de ${sub(t.se).nome} caducou`);
      noticia(`Caducou o TRC de ${t.mw} MW da ${G.empresa} em ${sub(t.se).nome}. A capacidade volta à rede.`, 'jogador');
      email({ de: 'DGEG', assunto: `TRC de ${sub(t.se).nome} caducado`, tipo: 'rede', imp: true, corpo: `<p>O título caducou. A caução de ${K(t.caucao)} foi executada e ${t.mw} MW voltam a estar livres na SE.</p>` });
    }
  });
}

    r.caixa += r.entrada;
    const E = ESTILO[r.estilo];
    // novos projetos
    if (r.caixa > 0.6 && chance(E.novo)) {

      const s = cand.length ? cand.sort((a, b) => (b.irr + (b.livre > 80 ? 60 : 0)) - (a.irr + (a.livre > 80 ? 60 : 0)))[Math.min(cand.length - 1, ri(0, 3))] : null;

function fimMandato() {
  const m = G.mandato; const r = m.rtb / m.meta;
  const resumo = { n: m.n, meta: m.meta, rtb: m.rtb, valor: valorCriado(), conf: G.confianca, ate: mesLabel(G.mes - 1) };
  G.carreira.push(resumo);
  let veredito;
  if (r >= 1) { veredito = 'cumprido'; mudaConf(15, 'Mandato cumprido'); }
  else if (r >= 0.65 && G.confianca >= 35) { veredito = 'reservas'; G.confianca = Math.max(35, G.confianca - 10); }
  else veredito = 'falhado';
  G.fim = { tipo: 'mandato', veredito, resumo };
  guardar(); render();
}
function fimCarreira(tipo, porque) { G.fim = { tipo, porque, resumo: { n: G.mandato.n, meta: G.mandato.meta, rtb: G.mandato.rtb, valor: valorCriado(), conf: G.confianca, ate: mesLabel(G.mes) } }; registarHof(tipo === 'despedido' ? 'Despedido' : 'Terminou'); guardar(); render(); }
function novoMandato() {

  arranqueAno(true); hist(); guardar(); render();
}
function registarHof(desfecho) {
  try {
    const h = JSON.parse(localStorage.getItem(HOF_KEY) || '[]');
    h.push({ quando: new Date().toISOString().slice(0, 10), manager: G.manager, empresa: G.empresa, tier: TIERS[G.tier].nome, tipo: TIPOS[G.tipo].nome, seed: G.seed, mandatos: G.carreira.length || 1,

      G.terrenos.push(tr);
      const p = criarProjeto(t, [tr], true); p.fi = l.fi; p.pago = true; p.rest = duracao(l.fi); p.risco = l.risco; p.riscoConhecido = !!(l.dd && l.dd.risco);
      p.log.push(`${mesLabel(G.mes)}: comprado a ${l.vendedor} em «${FASES[l.fi].nome}»`);
      toast(`Comprou o projeto ${p.nome} por ${M(c)}.`);
    } else toast(`Comprou ${l.mw} MW em ${sub(l.se).nome} por ${M(c)}.`);
    if (l.vendedor && G.rivais.some((r) => r.nome === l.vendedor)) { const r = G.rivais.find((x) => x.nome === l.vendedor); r.caixa += c; noticia(`${r.nome} vende ${l.mw} MW em ${sub(l.se).nome} à ${G.empresa}.`, 'rival', r.id); }

  },
  ddProj(d) { const l = G.mercadoLig.find((x) => x.id === d.id); if (G.caixa < 0.04) return toast('Sem caixa.'); despesa(0.04, 'Due diligence'); l.ddPedida = true; l.expira = Math.max(l.expira, G.mes + 2); G.tarefas.push({ tipo: 'ddproj', alvo: l.id, fim: G.mes + 1 }); guardar(); render(); toast('Due diligence ao projeto encomendada.'); },
  // pessoas
  relatorio(d) {
    const emCurso = G.tarefas.filter((t) => t.tipo === 'relatorio').length;
    if (emCurso >= 3) return toast('Já há 3 relatórios em curso.');
    G.tarefas.push({ tipo: 'relatorio', alvo: d.id, fim: G.mes + 1 }); pessoa(d.id).relPedido = true; guardar(); render(); toast('Relatório pedido. Chega no próximo mês.');
  },
  contratar(d) {
    const p = pessoa(d.id);
    if (minhaEquipa().length >= 12) return toast('A equipa já tem 12 pessoas.');
    if (p.recusou && p.recusou > G.mes) return toast(`${esc(p.nome)} não quer falar connosco até ${mesLabel(p.recusou)}.`);
    const deRival = p.onde.startsWith('rival:');
    const comp = deRival ? p.salario * 0.5 / 1000 : 0;
    if (G.caixa < comp + p.salario / 12 / 1000) return toast('Sem caixa.');
    const pr = deRival ? clamp(0.3 + p.ambicao * 0.025 - p.lealdade * 0.02 + G.confianca / 400, 0.05, 0.9) : clamp(0.55 + G.confianca / 250 + (p.a[p.funcao] < 13 ? 0.15 : 0), 0.1, 0.95);
    if (!chance(pr)) { p.recusou = G.mes + 6; guardar(); render(); return toast(`${esc(p.nome)} recusou a proposta${deRival ? ' e fica onde está' : ''}.`); }
    if (deRival) {
      const r = rival(p.onde.slice(6)); despesa(comp, 'Indemnizações e contratações'); p.salario = Math.round(p.salario * 1.2);
      r.atraso = 2; r.q = Math.max(6, r.q - 1);
      noticia(`${G.empresa} contrata ${p.nome} à ${r.nome}. Os projetos da ${r.nome} vão atrasar.`, 'jogador');
    }
    p.onde = 'jogador'; p.desde = G.mes; guardar(); render(); toast(`${esc(p.nome)} assinou. Salário ${p.salario} k€/ano.`);
  },
  despedir(d) { const p = pessoa(d.id); const c = p.salario * 0.25 / 1000; despesa(c, 'Indemnizações e contratações'); p.onde = 'livre'; p.recusou = G.mes + 24; guardar(); UI.ficha = null; render(); toast(`${esc(p.nome)} saiu. Indemnização ${K(c)}.`); },
  // projetos
  montar() {
    const tid = UI.f.mTrc; const t = trc(tid); if (!t) return toast('Escolha um TRC.');
    const ts = [...document.querySelectorAll('input[name=mTer]:checked')].map((x) => terreno(x.value));
    if (!ts.length) return toast('Escolha pelo menos um terreno.');
    const p = criarProjeto(t, ts);
    UI.ficha = { tipo: 'projeto', id: p.id }; guardar(); render(); toast(`Projeto ${p.nome} criado. A primeira fase arranca no próximo mês.`);
  },
  pausar(d) { const p = projeto(d.id); p.pausado = !p.pausado; guardar(); render(); },
  porVenda(d) { const p = projeto(d.id); if (G.tarefas.some((t) => t.tipo === 'venda' && t.alvo === p.id)) return; G.tarefas.push({ tipo: 'venda', alvo: p.id, fim: G.mes + 1 }); p.aVenda = true; guardar(); render(); toast('Projeto posto à venda. As ofertas chegam no próximo mês.'); },
  construir(d) {
    const p = projeto(d.id); const capex = p.mwp * CAPEX_MWP; const eq = capex * 0.25;
    if (G.tipo === 'operar' && G.confianca >= 50) { G.capitalRecebido += eq; conta('Capital da casa-mãe (obra)', eq); conta('Capitais próprios na obra', -eq); }
    else { if (G.caixa < eq) return toast(`Precisa de ${M(eq)} de capitais próprios (25 % do capex). ${G.tipo === 'operar' ? 'O Comité só financia com confiança ≥ 50.' : ''}`); despesa(eq, 'Capitais próprios na obra'); }
    p.fi = 4; p.rest = 12; p.capex = capex; p.eq = eq; p.log.push(`${mesLabel(G.mes)}: início da construção (capex ${M(capex)})`);
    noticia(`${G.empresa} arranca a construção do ${p.nome} (${p.mwp} MWp).`, 'jogador'); guardar(); render(); toast('Construção arrancou. 12 meses até operar.');
  },
  prorrogar(d) { const t = trc(d.id); if (t.prorrogado) return; t.prorrogado = true; G.tarefas.push({ tipo: 'prorrogacao', alvo: t.id, fim: G.mes + 2 }); guardar(); render(); toast('Pedido de prorrogação entregue.'); },
  abandonarProj(d) { MAILFN.abandonar({ p: d.id }); guardar(); render(); },
  // carreira
  novoMandato() { novoMandato(); },
  sairCarreira() { if (!G.fim || G.fim.tipo === 'mandato') registarHof(G.fim && G.fim.veredito === 'cumprido' ? 'Mandato cumprido' : G.fim && G.fim.veredito === 'falhado' ? 'Não renovado' : 'Saiu'); limparSave(); G = null; mostrarInicio(); },
  confirmarNova() { UI.confirm = 'nova'; render(); },
  cancelar() { UI.confirm = null; render(); },

    UI.view = 'inbox'; UI.sel = G.inbox[G.inbox.length - 1].id; G.inbox[G.inbox.length - 1].lido = true; UI.ficha = null; UI.f = {}; UI.tab = {};
    $('#start').hidden = true; $('#app').hidden = false; guardar(); render();
  },
  continuarSave() { if (carregar()) { $('#start').hidden = true; $('#app').hidden = false; render(); } },

function custoAcordo(s) { return 0.035 + (s.livre < 40 ? 0.025 : 0) + (s.kv < 220 ? 0.01 : 0); }
function criarProjeto(t, ts, comprado) {
  const s = sub(t.se); const mwpT = ts.reduce((a, x) => a + x.mwp, 0);
  const p = { id: nid('J'), nome: nomeProjeto(s), se: s.id, trc: t.id, terrenos: ts.map((x) => x.id), mwac: t.mw, mwp: Math.round(Math.min(mwpT, t.mw * 1.3)),
    irr: Math.round(ts.reduce((a, x) => a + x.irr * x.mwp, 0) / Math.max(1, mwpT)), linha: Math.max(...ts.map((x) => x.dist)),
    fi: 0, pago: false, rest: 0, estado: 'ativo', custo: 0, log: [`${mesLabel(G.mes)}: projeto montado (${t.mw} MWac, ${Math.round(Math.min(mwpT, t.mw * 1.3))} MWp)`], mod: {}, criado: G.mes, comprado: !!comprado };
  t.projeto = p.id; ts.forEach((x) => { x.uso = p.id; });
  G.projetos.push(p); return p;
}

const MAILFN = {
  recusar() { return 'Recusado.'; },
  reformular(a) { const p = projeto(a.p); p.bloqueado = false; p.pago = false; p.desconto = 0.5; p.log.push(`${mesLabel(G.mes)}: reformulação`); return 'O projeto volta a ser submetido no próximo mês.'; },
  abandonar(a) {
    const p = projeto(a.p); if (!p || p.estado !== 'ativo') return;
    p.estado = 'abandonado'; p.bloqueado = false; p.log.push(`${mesLabel(G.mes)}: abandonado`);
    const t = trc(p.trc); if (t) t.projeto = null;
    p.terrenos.forEach((id) => { const tr = terreno(id); if (tr) tr.uso = null; });
    mudaConf(-2, `${p.nome} abandonado`);
    return 'Projeto abandonado. O TRC e os terrenos estão livres na mesa de montagem.';
  },
  vender(a) {
    const p = projeto(a.p); if (!p || p.estado !== 'ativo') return 'O projeto já não está disponível.';
    const r = rival(a.r);
    receita(a.v, 'Venda de projetos'); p.estado = 'vendido'; p.vendidoPor = a.v; p.log.push(`${mesLabel(G.mes)}: vendido à ${r.nome} por ${M(a.v)}`);
    const t = trc(p.trc); if (t) { t.estado = 'vendido'; if (!t.devolvida) { soltar(t.caucao); t.devolvida = true; } }
    p.terrenos.forEach((id) => { const tr = terreno(id); if (tr) tr.estado = 'vendido'; });
    G.vendas.push({ mes: G.mes, p: p.id, nome: p.nome, mw: p.mwac, v: a.v, r: r.nome, custo: p.custo });
    r.caixa -= a.v * 0.3; r.mwRtb += p.fi >= 3 ? p.mwac : 0; r.projetos.push({ id: nid('R'), se: p.se, mw: p.mwac, fi: Math.min(p.fi, 5), rest: p.fi === 4 ? p.rest : (FASES[p.fi].meses || 0), rtbMes: G.mes, nome: p.nome, tent: 0, comprado: true });
    mudaConf(3, `Venda do ${p.nome}`);
    noticia(`${G.empresa} vende ${p.nome} (${p.mwac} MW) à ${r.nome} por ${M(a.v)}.`, 'jogador');
    return `Vendido por ${M(a.v)}.`;
  },
  manter(a) { const p = pessoa(a.p); p.salario += a.aum; return `${p.nome} fica. Novo salário ${p.salario} k€/ano.`; },
  deixarSair(a) { const p = pessoa(a.p); const r = rival(a.r); p.onde = 'rival:' + r.id; r.q = Math.min(18, r.q + 0.5); noticia(`${p.nome} troca a ${G.empresa} pela ${r.nome}.`, 'rival', r.id); return `${p.nome} saiu para a ${r.nome}.`; },
  comunidade(a) { const p = projeto(a.p); if (!p) return; const F = FASES[p.fi].id; if (a.s) { if (G.caixa < 0.06) { toast('Sem caixa.'); return false; } despesa(0.06, 'Comunidades'); p.mod[F] = (p.mod[F] || 0) + 0.06; p.mod.licenca = (p.mod.licenca || 0) + 0.04; return 'Sessão marcada. A contestação acalma.'; } p.mod[F] = (p.mod[F] || 0) - 0.07; p.mod.licenca = (p.mod.licenca || 0) - 0.05; return 'A contestação continua a crescer.'; },
  renda(a) { const t = terreno(a.t); if (a.s) { t.renda = Math.round(t.renda * 1.15); return 'Renda revista.'; } if (chance(0.35)) { const p = t.uso && projeto(t.uso); if (p && p.estado === 'ativo' && p.fi <= 2) { p.rest += 3; email({ de: 'Advogados', assunto: `${t.nome}: proprietário em tribunal`, tipo: 'projeto', corpo: `<p>O proprietário avançou com uma ação. O ${esc(p.nome)} atrasa 3 meses.</p>` }); } } return 'Pedido recusado.'; },
  credito() { receita(1.5, 'Crédito bancário'); G.divida = { saldo: 1.5, prestacao: 0.05, meses: 36 }; return 'Crédito de 1,5 M€ na conta.'; }
};

/* ============================================================
   GUARDAR
   ============================================================ */
function guardar() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (_) { /* sem armazenamento */ } }
function carregar() { try { const s = localStorage.getItem(SAVE_KEY); if (!s) return false; G = JSON.parse(s); return true; } catch (_) { return false; } }
function limparSave() { try { localStorage.removeItem(SAVE_KEY); } catch (_) { /* nada */ } }

/* ============================================================
   RENDER
   ============================================================ */
function th(tb, k, t, num) { const s = UI.sort[tb] || {}; const ar = s.k === k ? (s.dir > 0 ? ' ▲' : ' ▼') : ''; return `<th class="${num ? 'n' : ''}" data-act="sort" data-tb="${tb}" data-k="${k}" ${num ? 'data-num="1"' : ''}>${t}${ar}</th>`; }
function ordenar(tb, rows, def) {
  const s = UI.sort[tb] || def; if (!s) return rows;
  return rows.slice().sort((a, b) => { const x = a[s.k], y = b[s.k]; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt')) * s.dir; });
}
function pctBar(v, cls) { return `<div class="bar ${cls || ''}"><i style="width:${clamp(v, 0, 1) * 100}%"></i></div>`; }
function confCls(v) { return v >= 60 ? 'good' : v >= 30 ? 'warn' : 'bad'; }
function probCls(p) { return p >= 0.75 ? 'good' : p >= 0.55 ? 'warn' : 'bad'; }
function lnk(tipo, id, txt) { return `<a href="#" data-act="ficha" data-t="${tipo}" data-id="${id}">${esc(txt)}</a>`; }
function spark(vals, h) {
  if (vals.length < 2) return '<p class="note">O gráfico aparece ao fim de dois meses.</p>';
  const W = 300, H = h || 60, mn = Math.min(0, ...vals), mx = Math.max(...vals, mn + 1);
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, H - 4 - (v - mn) / (mx - mn) * (H - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const z = H - 4 - (0 - mn) / (mx - mn) * (H - 8); const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--line)" stroke-width="1"/><path d="${d} L ${W} ${H} L 0 ${H} Z" fill="var(--accent)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)"/></svg>`;
}

function render() {

  $('#hEmp').textContent = G.empresa;

  $('#hud').innerHTML = `
    <div><span>Data</span><b>${mesLabel(G.mes)}</b></div>
    <div><span>Caixa</span><b class="${G.caixa < 0 ? 'bad' : ''}">${M(G.caixa)}</b></div>
    <div><span>Confiança</span><b class="${confCls(G.confianca)}">${G.confianca}/100</b></div>
    <div><span>Mandato ${G.mandato.n}</span><b>${G.mandato.rtb}/${meta} MW RtB</b></div>
    <div><span>Faltam</span><b>${mesesRest} meses</b></div>`;
  const nLer = G.inbox.filter((e) => !e.lido).length;
  const nDec = G.inbox.filter((e) => e.acoes && !e.feito && !(e.expira != null && G.mes > e.expira)).length;
  const items = [
    ['', [['inbox', 'Caixa de entrada', nLer], ['painel', 'Painel'], ['comite', 'Comité e mandato'], ['noticias', 'Notícias', G.novasNoticias]]],
    ['A minha empresa', [['carteira', 'Carteira e projetos'], ['equipa', 'Equipa'], ['financas', 'Finanças']]],
    ['Mercados', [['terrenos', 'Terrenos'], ['ligacoes', 'Ligações à rede'], ['pessoas', 'Pessoas']]],
    ['O mundo', [['rede', 'Subestações'], ['rivais', 'Concorrência']]],
    ['', [['carreira', 'Carreira']]]
  ];
  $('#nav').innerHTML = items.map(([g, xs]) => (g ? `<div class="grp">${g}</div>` : '') + xs.map(([v, t, b]) => `<button class="${UI.view === v ? 'on' : ''}" data-act="nav" data-v="${v}"><span>${t}</span>${b ? `<span class="badge">${b > 99 ? '99+' : b}</span>` : ''}</button>`).join('')).join('');
  $('#btnAte').title = nDec ? `${nDec} decisões por tomar na caixa de entrada` : 'Avança mês a mês até chegar um email que pede decisão (máx. 6 meses)';
  let html = '';
  if (UI.ficha) html = `<div class="back"><button class="btn mini" data-act="voltar">◂ Voltar</button></div>` + (FICHAS[UI.ficha.tipo] ? FICHAS[UI.ficha.tipo](UI.ficha.id) : '');
  else html = (VIEWS[UI.view] || VIEWS.painel)();
  $('#view').innerHTML = html + (UI.msg ? `<div class="msg">${UI.msg}</div>` : '');
}

const VIEWS = {};
const FICHAS = {};

      <ul style="padding-left:18px;margin:10px 0 0">${G.objetivos.map((o) => { const [v, ok] = avaliarObj(o); return `<li class="${ok ? 'good' : ''}">${esc(o.txt)} <span class="dim num">(${typeof v === 'number' ? nf(v, v % 1 ? 2 : 0) : v})</span></li>`; }).join('')}</ul></div>

function classificacao() {
  const rows = G.rivais.map((r) => ({ id: r.id, nome: r.nome, mw: r.mwDev, op: r.mwOp, pipe: r.projetos.filter((p) => p.fi <= 2).reduce((s, p) => s + p.mw, 0), estilo: ESTILO[r.estilo].nome }));
  rows.push({ id: 'jogador', jog: true, nome: G.empresa, mw: G.mwRtbTotal, op: projAtivos().filter((p) => p.fi === 5).reduce((s, p) => s + p.mwac, 0), pipe: projAtivos().filter((p) => p.fi <= 2).reduce((s, p) => s + p.mwac, 0), estilo: '—' });

}

VIEWS.carteira = () => {

  const sel = UI.f.mTrc && trc(UI.f.mTrc) && !trc(UI.f.mTrc).projeto ? trc(UI.f.mTrc) : null;
  const terLivres = G.terrenos.filter((t) => t.estado === 'jogador' && !t.uso && (!sel || t.se === sel.se));

  <h3 style="margin:6px 0">Projetos</h3>
  <div class="tw"><table><thead><tr>${th('proj', 'nome', 'Projeto')}${th('proj', 'seN', 'SE')}${th('proj', 'mwac', 'MWac', 1)}${th('proj', 'mwp', 'MWp', 1)}${th('proj', 'fi', 'Fase')}<th class="n ns">Meses</th>${th('proj', 'prox', 'Prob. fase', 1)}${th('proj', 'val', 'Valor', 1)}</tr></thead><tbody>
  ${ativos.map((p) => `<tr class="click" data-act="ficha" data-t="projeto" data-id="${p.id}"><td>${esc(p.nome)}${p.pausado ? ' <span class="tag">pausado</span>' : ''}${p.bloqueado ? ' <span class="tag r">decisão</span>' : ''}${p.semCaixa ? ' <span class="tag r">sem caixa</span>' : ''}</td><td>${p.seN}</td><td class="n">${p.mwac}</td><td class="n">${p.mwp}</td><td>${p.faseN}</td><td class="n">${p.fi <= 2 && p.pago ? p.rest : p.fi === 4 ? p.rest : '—'}</td><td class="n ${p.prox >= 0 ? probCls(p.prox) : ''}">${p.prox >= 0 ? pct(p.prox) : '—'}</td><td class="n">${M(p.val)}</td></tr>`).join('') || '<tr><td colspan="8" class="dim">Ainda sem projetos. Junte um TRC e terrenos na mesa de montagem.</td></tr>'}
  ${outros.map((p) => `<tr class="click off" data-act="ficha" data-t="projeto" data-id="${p.id}"><td>${esc(p.nome)}</td><td>${p.seN}</td><td class="n">${p.mwac}</td><td class="n">${p.mwp}</td><td>${p.estado === 'vendido' ? 'Vendido (' + M(p.vendidoPor) + ')' : p.estado === 'caducado' ? 'TRC caducado' : 'Abandonado'}</td><td></td><td></td><td></td></tr>`).join('')}
  </tbody></table></div>

  <div class="grid" style="margin-top:14px">
  <div class="box"><h3>Mesa de montagem</h3>
    ${livresT.length ? `<div class="filters"><label for="mTrc" class="dim">TRC</label><select id="mTrc" data-act="filtro" data-k="mTrc"><option value="">Escolha…</option>${livresT.map((t) => `<option value="${t.id}" ${sel && sel.id === t.id ? 'selected' : ''}>${sub(t.se).nome} · ${t.mw} MW · até ${mesLabel(t.prazo)}</option>`).join('')}</select></div>
    ${sel ? (terLivres.length ? `<p class="dim" style="margin:0 0 6px">Terrenos optados em ${sub(sel.se).nome}:</p>${terLivres.map((t) => `<label style="display:block"><input type="checkbox" name="mTer" value="${t.id}" checked> ${esc(t.nome)} · ${t.mwp} MWp · ${nf(t.dist, 1)} km</label>`).join('')}${previewMontagem(sel, terLivres)}<div class="row" style="margin-top:8px"><button class="btn pri" data-act="montar">Criar projeto</button></div>` : `<p class="note">Não tem terrenos optados em ${sub(sel.se).nome}. Vá ao mercado de terrenos e filtre por esta SE.</p>`) : ''}`

  </div>
  <div class="box"><h3>Capacidade de rede (TRC)</h3><table><thead><tr><th class="ns">SE</th><th class="n ns">MW</th><th class="ns">Prazo RtB</th><th class="ns">Uso</th></tr></thead><tbody>
    ${G.trcs.filter((t) => t.estado === 'ativo').map((t) => `<tr class="click" data-act="ficha" data-t="trc" data-id="${t.id}"><td>${sub(t.se).nome}</td><td class="n">${t.mw}</td><td class="num ${!t.cumprido && t.prazo - G.mes <= 9 ? 'bad' : ''}">${t.cumprido ? 'cumprido' : mesLabel(t.prazo)}</td><td>${t.projeto ? esc(projeto(t.projeto).nome) : '<span class="tag a">livre</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="dim">Nenhum.</td></tr>'}</tbody></table></div>
  <div class="box"><h3>Terrenos optados</h3><table><thead><tr><th class="ns">Terreno</th><th class="ns">SE</th><th class="n ns">MWp</th><th class="ns">Uso</th></tr></thead><tbody>
    ${G.terrenos.filter((t) => t.estado === 'jogador').map((t) => `<tr class="click" data-act="ficha" data-t="terreno" data-id="${t.id}"><td>${esc(t.nome)}</td><td>${sub(t.se).nome}</td><td class="n">${t.mwp}</td><td>${t.uso ? esc(projeto(t.uso).nome) : '<span class="tag a">livre</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="dim">Nenhum.</td></tr>'}</tbody></table></div>
  </div>`;
};
function previewMontagem(t, ts) {
  const mwp = Math.min(ts.reduce((s, x) => s + x.mwp, 0), Math.round(t.mw * 1.3));
  const dcac = mwp / t.mw; const km = Math.max(...ts.map((x) => x.dist));
  const meses = [0, 1, 2].reduce((s, i) => s + duracao(i), 0) + 1;
  const fake = { se: t.se, terrenos: ts.map((x) => x.id), mod: {}, mwac: t.mw };
  const pAll = [0, 1, 2].reduce((s, i) => s * probVista(fake, i), 1);
  const custo = [0, 1, 2].reduce((s, i) => s + custoFase(fake, i), 0);
  const chega = G.mes + meses;
  return `<dl class="kv" style="margin-top:8px"><dt>Potência</dt><dd>${t.mw} MWac · ${mwp} MWp</dd><dt>Rácio DC/AC</dt><dd class="${dcac < 1.05 ? 'bad' : dcac > 1.2 ? 'good' : ''}">${nf(dcac, 2)}</dd><dt>Linha até à SE</dt><dd>${nf(km, 1)} km</dd><dt>Custo até RtB (sem falhas)</dt><dd>${M(custo)}</dd><dt>Prob. de chegar a RtB à primeira</dt><dd class="${probCls(pAll + 0.2)}">${pct(pAll)}</dd><dt>RtB previsto</dt><dd class="${chega > t.prazo ? 'bad' : ''}">${mesLabel(chega)} ${chega > t.prazo ? '(depois do prazo!)' : ''}</dd></dl>`;
}

function tagsTerreno(t) { return [t.ran && '<span class="tag">RAN</span>', t.ren && '<span class="tag">REN</span>', t.natura && '<span class="tag r">Natura</span>'].filter(Boolean).join('') || '<span class="dim">—</span>'; }

VIEWS.ligacoes = () => {
  const tab = UI.tab.lig || (G.leilao && G.leilao.estado === 'aberto' ? 'leilao' : 'se');
  const tabs = [['leilao', 'Leilão DGEG'], ['se', 'Pedido ou acordo por SE'], ['sec', `Mercado secundário (${G.mercadoLig.length})`]];
  let body = '';
  if (tab === 'leilao') {
    const L = G.leilao;
    if (!L) body = `<p class="note">O leilão anual é anunciado em março. Próximo: ${mesLabel(G.mes % 12 < 2 ? G.mes - (G.mes % 12) + 2 : G.mes - (G.mes % 12) + 14)}.</p>`;
    else {
      const aberto = L.estado === 'aberto' && G.mes <= L.fecha;
      body = `<p>${aberto ? `Leilão ${L.ano}: lances até ao fim de <b>${mesLabel(L.fecha)}</b>, resultados em ${mesLabel(L.resolve)}. Caução de ${nf(CAUCAO_MW * 1000, 0)} k€/MW por lance, devolvida se perder. Ganha a maior contrapartida.` : L.estado === 'aberto' ? `Lances fechados. Resultados em ${mesLabel(L.resolve)}.` : `Leilão ${L.ano} encerrado. O próximo abre em março.`}</p>
      <div class="tw"><table><thead><tr><th class="ns">Lote</th><th class="n ns">MW</th><th class="n ns">Livres na SE</th><th class="ns">Câmara</th><th class="n ns">kWh/kWp</th><th class="ns">${L.estado === 'fechado' ? 'Vencedor' : 'O seu lance (k€/MW)'}</th></tr></thead><tbody>
      ${L.lotes.map((l) => { const s = sub(l.se); return `<tr><td>${lnk('se', s.id, s.nome)}</td><td class="n">${l.mw}</td><td class="n">${s.livre}</td><td>${CAMARA[s.camara]}</td><td class="n">${s.irr}</td><td>${L.estado === 'fechado' ? (l.venc === 'jogador' ? `<b class="good">${esc(G.empresa)}</b> · ${nf(l.valor, 1)}` : l.venc ? `${esc(rival(l.venc).nome)} · ${nf(l.valor, 1)}` : 'Deserto') : aberto ? `<div class="row"><input type="number" id="lance-${l.id}" min="0.5" step="0.5" value="${l.meu || ''}" placeholder="ex. 9" aria-label="Lance em k€/MW"><button class="btn mini pri" data-act="lance" data-id="${l.id}">${l.meu ? 'Alterar' : 'Licitar'}</button>${l.meu ? `<button class="btn mini" data-act="retirarLance" data-id="${l.id}">Retirar</button>` : ''}</div>` : (l.meu ? nf(l.meu, 1) : '—')}</td></tr>`; }).join('')}
      </tbody></table></div><p class="note">Pagaria a contrapartida × MW se ganhar: ${L.lotes.filter((l) => l.meu).map((l) => `${sub(l.se).nome} ${M(l.meu * l.mw / 1000)}`).join(' · ') || 'sem lances'}. Os rivais costumam licitar entre 3 e 20 k€/MW.</p>`;
    }
  }
  if (tab === 'se') {
    const rows = ordenar('lse', G.subs.map((s) => ({ ...s, ca: custoAcordo(s) })), { k: 'livre', dir: -1 });
    body = `<p class="note">Pedido geral: caução de ${nf(CAUCAO_MW * 1000, 0)} k€/MW, decisão em 6 meses, só passa se houver MW livres quando a DGEG decidir (a fila conta). Acordo com o operador: paga o reforço à cabeça, decisão em 9 meses, funciona mesmo sem capacidade livre; se falhar, recupera 70 %. A força da equipa em rede melhora as duas.</p>
    <div class="tw"><table><thead><tr>${th('lse', 'nome', 'Subestação')}${th('lse', 'kv', 'kV', 1)}${th('lse', 'livre', 'MW livres', 1)}${th('lse', 'fila', 'Fila', 1)}${th('lse', 'calor', 'Calor', 1)}${th('lse', 'ca', 'Acordo k€/MW', 1)}<th class="ns">MW</th><th class="ns">Ação</th></tr></thead><tbody>
    ${rows.map((s) => `<tr><td>${lnk('se', s.id, s.nome)}${s.reforco && s.reforco.sabido && !s.reforco.feito ? ' <span class="tag a">reforço</span>' : ''}</td><td class="n">${s.kv}</td><td class="n ${s.livre < 30 ? 'bad' : ''}">${s.livre}</td><td class="n">${s.fila}</td><td class="n">${Math.round(s.calor)}</td><td class="n">${nf(s.ca * 1000, 0)}</td><td><input type="number" id="mw-${s.id}" min="10" step="10" value="${Math.max(10, Math.min(100, Math.floor(s.livre / 10) * 10 || 50))}" aria-label="MW a pedir em ${esc(s.nome)}"></td><td class="row"><button class="btn mini" data-act="pedido" data-se="${s.id}" ${s.livre < 10 ? 'disabled' : ''}>Pedido</button><button class="btn mini" data-act="acordo" data-se="${s.id}">Acordo</button></td></tr>`).join('')}
    </tbody></table></div>`;
  }
  if (tab === 'sec') {
    body = `<p class="note">Capacidade e projetos a meio vendidos por developers e rivais. O preço já inclui o desconto da sua negociação (${pct(clamp((forte('neg') - 8) * 0.012, 0, 0.12))}). Atenção ao prazo que resta ao título.</p>
    <div class="tw"><table><thead><tr><th class="ns">Vendedor</th><th class="ns">O quê</th><th class="ns">SE</th><th class="n ns">MW</th><th class="n ns">Preço</th><th class="n ns">k€/MW</th><th class="ns">Prazo do TRC</th><th class="ns">Riscos</th><th class="ns">Ação</th></tr></thead><tbody>
    ${G.mercadoLig.map((l) => { const c = precoNeg(l.tipo === 'compra' ? l.mw * l.precoMW : l.preco); return `<tr><td>${esc(l.vendedor)}</td><td>${l.tipo === 'compra' ? 'Só TRC' : 'Projeto em ' + FASES[l.fi].curto.toLowerCase()}</td><td>${lnk('se', l.se, sub(l.se).nome)}</td><td class="n">${l.mw}</td><td class="n">${M(c)}</td><td class="n">${nf(c / l.mw * 1000, 0)}</td><td class="num ${l.prazoRest < 20 ? 'bad' : ''}">${l.prazoRest} meses</td><td>${l.tipo === 'projeto' ? (l.dd ? (l.dd.risco ? `<span class="tag r">${PROB_ESC[l.dd.risco]}</span>` : '<span class="tag g">DD limpa</span>') : l.ddPedida ? 'DD em curso' : `<button class="btn mini" data-act="ddProj" data-id="${l.id}">DD (40 k€)</button>`) : '—'}</td><td><button class="btn mini pri" data-act="comprarLig" data-id="${l.id}" ${G.caixa < c ? 'disabled' : ''}>Comprar</button></td></tr>`; }).join('') || '<tr><td colspan="9" class="dim">Nada à venda neste momento.</td></tr>'}
    </tbody></table></div>`;
  }
  return `<div class="vh"><div><h2>Mercado de ligações à rede</h2><p>Sem capacidade de injeção não há projeto. Quatro vias: leilão, pedido geral, acordo com o operador e compra a quem já tem.</p></div></div>
  <div class="tabs">${tabs.map(([k, t]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-g="lig" data-v="${k}">${t}</button>`).join('')}</div>${body}`;
};

VIEWS.pessoas = () => {
  const ff = UI.f.pf || 'todas', fo = UI.f.po || 'livre';
  let rows = G.pessoas.filter((p) => p.onde !== 'jogador' && (ff === 'todas' || p.funcao === ff) && (fo === 'todos' || (fo === 'livre' ? p.onde === 'livre' : p.onde.startsWith('rival:'))));

  return `<div class="vh"><div><h2>Mercado de pessoas</h2><p>Quadros fictícios. Os atributos aparecem em intervalos até pedir um relatório (grátis, 1 mês, máx. 3 em curso; ${emCurso} agora). Contratar a um rival custa meio salário de compensação e atrasa os projetos dele.</p></div></div>
